<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
button{color:#eee;background:transparent;border:1px solid #8889;border-radius:24px;padding:12px 23px;font-size:11px;letter-spacing:.18em;font-weight:300;cursor:pointer}
button:active{background:#eee;color:#111}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:clamp(26px,7vw,92px);background:transparent;z-index:100;pointer-events:none}
#intro>div,#intro>canvas{pointer-events:auto}
.kicker{font-size:12px;letter-spacing:.32em;opacity:.8;font-weight:300;margin-bottom:23px}
.title{font-size:clamp(39px,11vw,110px);letter-spacing:.01em;font-weight:750;margin:30px 0 38px;line-height:1.03}
#en{font-size:clamp(19px,3vw,31px);line-height:1.55;min-height:38px;letter-spacing:.055em;font-weight:300;max-width:85vw}
#es{font-size:clamp(12px,1.7vw,16px);line-height:1.5;min-height:27px;color:#aaa;max-width:85vw}
#credit{color:#b7b7b7;font-size:12px;line-height:2;letter-spacing:.12em;margin:30px 0}
#credit a{color:#bbb;text-decoration:none}
#voice{width:min(430px,80vw);height:32px;display:none;opacity:.4;margin-top:8px}
#modebar{display:none}#status{position:fixed;bottom:11px;left:14px;font-size:10px;color:#b6b6b6;z-index:95}
#xrButton{z-index:155;position:fixed;right:10px;bottom:12px}
#development{display:none;position:fixed;top:9px;left:12px;font:10px monospace;color:#aaa;z-index:82;pointer-events:none;opacity:.75}
[hidden]{display:none!important}
</style>
</head><body>
<div id="intro">
 <div class="kicker">TECHNO POESIS</div><div class="title">ATMOSPHERE</div>
 <div id="en"></div><div id="es"></div><canvas width="640" height="64" id="voice"></canvas>
 <div id="credit">Ricardo P. Tapia Fernández · Oktopus Art Studio<br>Art, nature and technology · <a href="https://www.instagram.com/oktopus.art/" target="_blank" rel="noopener">@oktopus.art ↗</a></div>
 <div><button id="start">ENTER VR · START</button><button id="skip" hidden>SKIP INTRO</button><button id="enter" hidden>ENTER EXPERIENCE · VR</button></div>
</div>
<div id="modebar"></div>
<div id="status">ATMOSPHERE / TECHNO POESIS</div>
<div id="xrButton"></div><div id="development">INITIALIZING...</div>
<script>
(function(){
 const debug=new URLSearchParams(location.search).get('debug')==='1';
 const panel=document.getElementById('development');
 const messages=[];
 if(debug)panel.style.display='block';
 window.atmosDiagnostic=function(msg){
  const value=String(msg||'Unknown error');
  messages.push(value);if(messages.length>5)messages.shift();
  console.error('[ATMOSPHERE XR]',value);
  if(debug)panel.textContent=messages.join('\n');
  // Keep real errors accessible without overlaying the artwork.
  const status=document.getElementById('status');
  if(status)status.textContent=debug?value:'Technical warning · use ?debug=1';
 };
 window.addEventListener('error',e=>window.atmosDiagnostic('JS: '+(e.message||e.error?.message||'load failed')));
 window.addEventListener('unhandledrejection',e=>window.atmosDiagnostic('ASYNC: '+(e.reason?.message||e.reason)));
 setTimeout(()=>{if(!window.atmosAppReady)window.atmosDiagnostic('Experience not initialized')},10000);
})();
</script>

<script type="module" src="./quest.js?build=score-v6b"></script>
