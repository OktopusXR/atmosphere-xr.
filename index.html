<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATMOSPHERE XR — Oktopus Art Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020309;color:#eef3ff;font:13px Arial,sans-serif;overflow:hidden}canvas{display:block}
#panel{position:fixed;z-index:5;top:14px;left:14px;width:min(315px,calc(100% - 28px));padding:17px;background:#060b1cdb;border:1px solid #33445d;border-radius:12px;backdrop-filter:blur(10px)}
h1{font-size:20px;letter-spacing:4px;font-weight:400;margin:0 0 6px}.sub{font-size:10px;letter-spacing:2px;color:#a3b5d2}
p{color:#c1cbe0;line-height:1.5}button{border:1px solid #6982b0;border-radius:7px;background:#34558a;color:white;padding:11px;cursor:pointer}#start{width:100%;margin:8px 0}#pause{width:100%;display:none}input{width:100%;accent-color:#8bb8ff}label{display:block;margin-top:12px;font-size:11px;color:#b8c7de}
#status{font-size:11px;line-height:1.5;color:#a8caff;margin-top:12px}#links{position:fixed;bottom:16px;left:16px;z-index:6;display:flex;gap:12px}a{color:#d4e3ff;background:#0a1329d9;border:1px solid #304563;padding:10px;border-radius:7px;text-decoration:none;font-size:12px}
</style></head><body>
<div id="panel"><h1>ATMOSPHERE</h1><div class="sub">OKTOPUS ART STUDIO</div>
<p>Immersive soundscape · Frecuencias convertidas en geometría, partículas y luz.</p>
<button id="start">INICIAR EXPERIENCIA</button><button id="pause">PAUSAR</button>
<label>INTENSIDAD AUDIOVISUAL<input id="intensity" type="range" min=".2" max="3" step=".1" value="1.3"></label>
<div id="status">Preparado. El audio se reproduce desde atmosphereADM_binaural.mp3.</div></div>
<div id="links"><a target="_blank" rel="noopener" href="https://open.spotify.com/track/7JTEfJqz2rBNOkRB7A9w4K">Spotify</a><a target="_blank" rel="noopener" href="https://music.apple.com/us/search?term=Oktopus%20Atmosphere">Apple Music ↗</a></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.173.0';
const $=id=>document.getElementById(id),start=$('start'),pause=$('pause'),status=$('status'),intensity=$('intensity');
const audio=new Audio('./atmosphereADM_binaural.mp3');audio.preload='metadata';audio.crossOrigin='anonymous';
let ctx,analyser,fft,source,started=false,bass=0,mid=0,high=0,energy=0;
async function initAudio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.78;fft=new Uint8Array(analyser.frequencyBinCount);source=ctx.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ctx.destination)}await ctx.resume()}
start.onclick=async()=>{try{await initAudio();if(!started){audio.currentTime=0;started=true}await audio.play();start.textContent='REPRODUCIENDO';pause.style.display='block';pause.textContent='PAUSAR';status.textContent='Audio FFT activo · graves / medios / agudos'}catch(e){status.textContent='No se pudo reproducir atmosphereADM_binaural.mp3. Comprueba que esté en la raíz del repositorio. '+e.message}};
pause.onclick=async()=>{if(audio.paused){await ctx.resume();await audio.play();pause.textContent='PAUSAR'}else{audio.pause();pause.textContent='REANUDAR'}};
audio.onended=()=>{started=false;start.textContent='REINICIAR EXPERIENCIA';pause.style.display='none';status.textContent='Experiencia finalizada'};
audio.onerror=()=>{status.textContent='No se encuentra atmosphereADM_binaural.mp3 o el formato no es compatible.'};
function band(a,b){const nyquist=ctx.sampleRate/2;let lo=Math.max(0,Math.floor(a/nyquist*fft.length)),hi=Math.min(fft.length,Math.ceil(b/nyquist*fft.length)),s=0;for(let i=lo;i<hi;i++)s+=fft[i];return s/Math.max(1,hi-lo)/255}
function analyse(){if(analyser&&!audio.paused&&!audio.ended){analyser.getByteFrequencyData(fft);bass+=(band(20,160)-bass)*.25;mid+=(band(160,2000)-mid)*.25;high+=(band(2000,12000)-high)*.25;energy=bass*.5+mid*.35+high*.15}else{bass*=.94;mid*=.94;high*=.94;energy*=.94}}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020309);scene.fog=new THREE.FogExp2(0x020309,.012);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,150);camera.position.set(0,1.6,4);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x627aff,1.2));const blue=new THREE.PointLight(0x55aaff,20,20),violet=new THREE.PointLight(0x7744ff,15,20);blue.position.set(3,4,2);violet.position.set(-3,0,-2);scene.add(blue,violet);
const universe=new THREE.Group();universe.position.set(0,1.6,-2);scene.add(universe);
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.65,3),new THREE.MeshPhysicalMaterial({color:0x567aff,metalness:.4,roughness:.18,wireframe:true,transparent:true,opacity:.75}));universe.add(core);
const inner=new THREE.Mesh(new THREE.DodecahedronGeometry(.37,2),new THREE.MeshBasicMaterial({color:0x77bbff,transparent:true,opacity:.22,wireframe:true}));universe.add(inner);
const rings=[];for(let i=0;i<7;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(.95+i*.21,.007,6,150),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(.56+i*.025,.85,.65),transparent:true,opacity:.48,depthWrite:false}));r.rotation.x=i*.41;r.rotation.y=i*.57;universe.add(r);rings.push(r)}
const count=1600,pos=new Float32Array(count*3),original=new Float32Array(count*3);for(let i=0;i<count;i++){const r=1.8+Math.random()*7,a=Math.random()*Math.PI*2,z=Math.random()*2-1,f=Math.sqrt(1-z*z);pos[i*3]=r*f*Math.cos(a);pos[i*3+1]=r*z;pos[i*3+2]=r*f*Math.sin(a)}original.set(pos);
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));const particles=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8aabff,size:.019,transparent:true,opacity:.65,depthWrite:false}));universe.add(particles);
const satellites=[];for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.035+Math.random()*.055),new THREE.MeshBasicMaterial({color:0x7bcfff,wireframe:true,transparent:true,opacity:.65}));m.userData={radius:1.5+Math.random()*2.3,speed:.12+Math.random()*.25,phase:Math.random()*6.28,height:(Math.random()-.5)*2};universe.add(m);satellites.push(m)}
const clock=new THREE.Clock();let t=0;
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);analyse();const playing=!audio.paused&&!audio.ended;t+=playing?dt:dt*.1;const gain=Number(intensity.value),b=bass*gain,m=mid*gain,h=high*gain,e=energy*gain;
core.scale.setScalar(1+b*1.3);core.rotation.x+=dt*(.06+m*.4);core.rotation.y+=dt*(.1+m*.5);inner.scale.setScalar(1+m*.6);inner.rotation.z+=dt*(.07+m*.5);
rings.forEach((r,i)=>{r.rotation.z+=dt*(.03+i*.008+m*.4);r.rotation.y+=dt*(.025+h*.3);r.scale.setScalar(1+m*(.22+i*.025));r.material.opacity=Math.min(.95,.2+m*.65)});
particles.rotation.y+=dt*(.005+h*.07);particles.material.opacity=Math.min(1,.3+h*.65);particles.material.size=.016+h*.024;
const a=pg.attributes.position;for(let i=0;i<count;i++){const k=i*3,expand=1+h*.2+Math.sin(t*.4+i)*h*.08;a.array[k]=original[k]*expand;a.array[k+1]=original[k+1]*expand;a.array[k+2]=original[k+2]*expand}a.needsUpdate=true;
satellites.forEach((s,i)=>{const d=s.userData,a=t*(d.speed+m*.3)+d.phase,r=d.radius*(1+b*.2);s.position.set(Math.cos(a)*r,d.height+Math.sin(t*.4+i)*(.2+h*.3),Math.sin(a)*r);s.rotation.x+=dt*(.2+m);s.rotation.y+=dt*(.1+h)});
blue.intensity=12+e*35;violet.intensity=10+e*28;universe.rotation.y=Math.sin(t*.045)*(.12+e*.05);
renderer.render(scene,camera)});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
