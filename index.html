<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATMOSPHERE — Oktopus Art Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040b;color:#e9f3ff;font:13px system-ui,Arial}
canvas{display:block}button{color:#e6f3ff;background:#14243fbc;border:1px solid #6683a4;border-radius:7px;padding:11px 17px;letter-spacing:.12em;cursor:pointer}
#intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;background:rgba(2,5,14,.42);backdrop-filter:blur(8px)}
#title{font-size:clamp(40px,9vw,104px);font-weight:250;letter-spacing:.15em;line-height:1.1;text-shadow:0 0 22px #31547a88}

#introEs{font-size:clamp(13px,2vw,18px);color:#a0b8d0;margin-top:12px;max-width:720px}

</style></head><body>
<div id="intro">
 <div id="kicker">TECHNO POESIS</div><div id="title">ATMOSPHERE</div>
 <div id="introEn"></div><div id="introEs"></div>
 <canvas id="voiceWave" width="640" height="88"></canvas>
 <div id="introAuthor" style="display:none">Ricardo P. Tapia Fernández · Oktopus Art Studio<br>Art, nature and technology · <a href="https://www.instagram.com/oktopus.art/" target="_blank" rel="noopener">@oktopus.art ↗</a></div>
 <button id="startIntro">START</button><button id="skip" style="display:none">SKIP INTRO</button><button id="enter" style="display:none">ENTER EXPERIENCE</button>
</div>
<button id="controlsBtn">CONTROLS</button>
<div id="controls"><b>ATMOSPHERE</b><p id="status">Ready</p><button id="pause">PAUSE / RESUME</button>
 <label>BASS · <span id="bassVal">0</span> dB<input id="bass" type="range" min="-12" max="12" step="1" value="0"></label>
 <label>MID · <span id="midVal">0</span> dB<input id="mid" type="range" min="-12" max="12" step="1" value="0"></label>
 <label>HIGH · <span id="highVal">0</span> dB<input id="high" type="range" min="-12" max="12" step="1" value="0"></label>
 <label>VISUAL RESPONSE<input id="sensitivity" type="range" min=".3" max="2.8" step=".1" value="1.5"></label>
 <div class="links"><a href="https://open.spotify.com/track/7JTEfJqz2rBNOkRB7A9w4K" target="_blank" rel="noopener">Spotify ↗</a><a href="https://music.apple.com/us/album/atmosphere-single/6815019097" target="_blank" rel="noopener">Apple Music · Dolby Atmos ↗</a></div>
</div>
<div id="xrButton"></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.173.0';
const $=id=>document.getElementById(id);
const status=$('status'),button=$('controlsBtn');
let entered=false,eq=[0,0,0],selected=0,vrPanelShown=true;
const controlIds=['bass','mid','high'],eqLabels=['bassVal','midVal','highVal'];
const music=new Audio('./atmosphereADM_binaural.mp3');music.preload='metadata';
music.crossOrigin='anonymous';
const narration=new Audio('./atmosphere-intro.ogg');narration.preload='auto';
let context,filters,analyser,source,spectrum,timeData,previous,low=0,mid=0,high=0,rms=0,flux=0;
const narrative=[
 ['Invisible networks connect all forms of life.','Redes invisibles conectan todas las formas de vida.'],
 ['From body to Earth. From Earth to cosmos.','Del cuerpo a la Tierra. De la Tierra al cosmos.'],
 ['Listen. You are part of this resonance.','Escucha. Eres parte de esta resonancia.']
];
let introStarted=false,introDone=false,voiceLive=false,narrationFallback=false;
const INTRO_TIMINGS=[0,4000,8300],INTRO_TOTAL=13300;let introTimers=[];
function clearIntroTimers(){introTimers.forEach(clearTimeout);introTimers=[]}
const introText=$('introEn'),introSub=$('introEs'),voiceCanvas=$('voiceWave'),vc=voiceCanvas.getContext('2d');
let captionIndex=0;
function caption(n){captionIndex=n;introText.textContent=narrative[n]?.[0]||'';introSub.textContent=narrative[n]?.[1]||'';if(renderer.xr.isPresenting)paintXRIntro()}
function finishIntro(){
 if(introDone)return;
 introDone=true;voiceLive=false;clearIntroTimers();narration.pause();voiceCanvas.style.display='none';
 if('speechSynthesis' in window)speechSynthesis.cancel();
 introText.textContent='';introSub.textContent='';if(renderer.xr.isPresenting)paintXRIntro();
 $('introAuthor').style.display='block';$('startIntro').style.display='none';
 $('skip').style.display='none';$('enter').style.display='block';
}
function playSpeechFallback(){
 narrationFallback=true;
 if(!('speechSynthesis' in window))return;
 const u=new SpeechSynthesisUtterance(narrative.map(x=>x[0]).join(' ... '));
 u.lang='en-US';u.rate=.8;u.pitch=1.06;u.onstart=()=>{voiceLive=true};
 u.onend=()=>{voiceLive=false};speechSynthesis.cancel();speechSynthesis.speak(u);
}
$('startIntro').onclick=()=>{
 if(introStarted)return;
 introStarted=true;voiceLive=true;
 $('startIntro').style.display='none';$('skip').style.display='block';
 voiceCanvas.style.display='block';caption(0);if(renderer.xr.isPresenting)paintXRIntro();
 // HTML media, rather than browser speech synthesis, works in Quest Browser.
 const attempt=narration.play();
 if(attempt?.catch)attempt.catch(()=>{if(!narrationFallback)playSpeechFallback()});
 INTRO_TIMINGS.slice(1).forEach((ms,i)=>introTimers.push(setTimeout(()=>{if(!introDone)caption(i+1)},ms)));
 introTimers.push(setTimeout(finishIntro,INTRO_TOTAL));
};
narration.onended=()=>{voiceLive=false};
narration.onerror=()=>{if(introStarted&&!introDone&&!narrationFallback)playSpeechFallback()};
$('skip').onclick=finishIntro;
let voiceTime=0;
function drawNarration(dt){
 if(!voiceLive||introDone)return;
 voiceTime+=dt;
 vc.clearRect(0,0,640,88);
 // The narration is a separate media file; no fake frequency spectrum is claimed.
 for(let i=0;i<62;i++){
  const x=(i+.5)*640/62,window=Math.pow(Math.max(0,1-Math.abs(i-31)/32),1.5);
  const value=(narrationFallback?.35:.6)*window*(.4+.25*Math.sin(i*.64+voiceTime*11)+.18*Math.sin(i*.25-voiceTime*6));
  const h=4+value*68;vc.fillStyle='rgba(164,215,255,'+(.25+window*.65)+')';
  vc.fillRect(x-2,44-h*.5,4,h);
 }
}
function setEQ(){controlIds.forEach((id,i)=>{$(id).value=eq[i];$(eqLabels[i]).textContent=(eq[i]>0?'+':'')+eq[i];if(filters)filters[i].gain.value=eq[i]});paintPanel()}
controlIds.forEach((id,i)=>$(id).addEventListener('input',()=>{eq[i]=+$(id).value;selected=i;setEQ()}));
button.onclick=()=>{const show=$('controls').style.display!=='block';$('controls').style.display=show?'block':'none';button.textContent=show?'HIDE CONTROLS':'CONTROLS'};
$('pause').onclick=async()=>{if(!context)return;if(music.paused){await context.resume();await music.play()}else music.pause()};
music.onended=()=>{status.textContent='Experience completed';music.currentTime=0};
async function initSound(){
 if(!context){
  context=new (window.AudioContext||window.webkitAudioContext)();
  filters=[
   new BiquadFilterNode(context,{type:'lowshelf',frequency:160}),
   new BiquadFilterNode(context,{type:'peaking',frequency:950,Q:.75}),
   new BiquadFilterNode(context,{type:'highshelf',frequency:2700})
  ];
  analyser=context.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.65;
  spectrum=new Uint8Array(analyser.frequencyBinCount);previous=new Uint8Array(spectrum.length);
  timeData=new Float32Array(analyser.fftSize);
  source=context.createMediaElementSource(music);source.connect(filters[0]);
  filters[0].connect(filters[1]);filters[1].connect(filters[2]);
  filters[2].connect(analyser);analyser.connect(context.destination);setEQ();
 }
 await context.resume();
}
function band(from,to){
 const ny=context.sampleRate/2;let l=Math.floor(from/ny*spectrum.length),h=Math.ceil(to/ny*spectrum.length),sum=0;
 l=Math.max(0,l);h=Math.min(spectrum.length,Math.max(h,l+1));
 for(let i=l;i<h;i++)sum+=spectrum[i];return sum/(h-l)/255;
}
let avgFlux=.01,onset=0,onsetCooldown=0,quiet=0;
// Deterministic sound dramaturgy. Stages respond to longer-term audio conditions;
// stage changes are held, not retriggered by every small FFT fluctuation.
const STAGES=['FIELD','TRACES','WIREFRAME','INTERWEAVE','FRACTURE','DRIFT','RETURN','DISSOLUTION'];
let stage=0,stageHold=0,stageMix=0,energyMemory=0,textureMemory=0,gestureMemory=0;
let act=0,actTime=0,actBlend=0,impact=0,panelUpdateClock=0;
let lastAct=-1,activityGate=0;
// Music-time dramaturgy: acts give the composition a visual syntax;
// live spectrum, RMS, novelty and gestures define the movement *inside* each act.
const ACTS=['FIELD / LATENCY','TRACES / EMERGENCE','WIREFRAME / GROWTH',
 'INTERWEAVE / TENSION','FRACTURE / RELEASE','PARTICLE / DRIFT',
 'RETURN / RESONANCE','DISSOLUTION'];
const ACT_CUTS=[0,.09,.21,.34,.48,.61,.75,.88,1];
const VISUAL_GAP=.13; // allocated dark prelude to each visual event
function smooth01(v){v=THREE.MathUtils.clamp(v,0,1);return v*v*(3-2*v)}
function updateDramaturgy(dt){
 const energy=Math.min(1,rms*6.5);
 const texture=Math.min(1,mid*1.9+high*.9);
 energyMemory+=(energy-energyMemory)*Math.min(1,dt*.4);
 textureMemory+=(texture-textureMemory)*Math.min(1,dt*.6);
 gestureMemory+=(onset-gestureMemory)*Math.min(1,dt*1.6);
 const total=Number.isFinite(music.duration)&&music.duration>0?music.duration:402;
 const progress=THREE.MathUtils.clamp(music.currentTime/total,0,.999999);
 let next=ACT_CUTS.findIndex((cut,i)=>i<ACT_CUTS.length-1&&progress>=cut&&progress<ACT_CUTS[i+1]);
 next=THREE.MathUtils.clamp(next,0,ACTS.length-1);
 act=next;actTime=(progress-ACT_CUTS[act])/(ACT_CUTS[act+1]-ACT_CUTS[act]);
 // Near act boundaries old and new systems overlap gently rather than jump.
 actBlend=smooth01(actTime/.12);
 stage=act;stageMix+=(act-stageMix)*Math.min(1,dt*.55);
 impact+=((onset+flux*1.7)-impact)*Math.min(1,dt*5.4);
 panelUpdateClock+=dt;
 if(renderer.xr.isPresenting&&hud.visible&&(act!==lastAct||panelUpdateClock>.4)){
  paintPanel();panelUpdateClock=0;lastAct=act;
 }
}

function analyze(dt){
 if(!analyser||music.paused||music.ended){
  low*=.97;mid*=.97;high*=.97;rms*=.97;onset*=.92;return;
 }
 analyser.getByteFrequencyData(spectrum);analyser.getFloatTimeDomainData(timeData);
 let sum=0,novel=0,count=0;
 for(let i=0;i<timeData.length;i+=4)sum+=timeData[i]*timeData[i];
 for(let i=2;i<Math.min(550,spectrum.length);i+=3){
  novel+=Math.max(0,spectrum[i]-previous[i])/255;count++;
 }
 previous.set(spectrum);
 const fluxNow=novel/Math.max(1,count);avgFlux=avgFlux*.98+fluxNow*.02;
 rms+=(Math.sqrt(sum/(timeData.length/4))-rms)*.16;
 low+=(band(20,160)-low)*.12;mid+=(band(160,2000)-mid)*.1;high+=(band(2000,12000)-high)*.1;
 onsetCooldown=Math.max(0,onsetCooldown-dt);
 if(fluxNow>Math.max(.033,avgFlux*2.2)&&rms>.018&&onsetCooldown<=0){onset=1;onsetCooldown=1.1}
 onset*=Math.exp(-dt*1.9);flux+=(fluxNow-flux)*.13;
 quiet+=((rms<.026?1:0)-quiet)*.03;
}
// Minimal sonic ecology: one filament network, one particulate shell, sparse tetrahedra.
const scene=new THREE.Scene();scene.background=new THREE.Color(0x010101);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,90);
camera.position.set(0,1.6,0);scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);
const root=new THREE.Group();scene.add(root);
// Bakkslide-inspired grayscale wireframe deformation, not a separate random particle effect.
const FIELD_GRID=40,fieldGeo=new THREE.SphereGeometry(3.25,FIELD_GRID,28);
const fieldBase=Float32Array.from(fieldGeo.attributes.position.array);
const fieldMat=new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.15,depthWrite:false,side:THREE.DoubleSide});
const wireField=new THREE.Mesh(fieldGeo,fieldMat);
wireField.position.set(0,1.6,0);wireField.rotation.set(0,0,0);
root.add(wireField);

// Faceted luminous shell: per-face light states, linked to transients and spectral energy.
const facetGeo=new THREE.IcosahedronGeometry(3.17,3).toNonIndexed();
const facePositions=facetGeo.attributes.position;
const faceColors=new Float32Array(facePositions.count*3);
facetGeo.setAttribute('color',new THREE.BufferAttribute(faceColors,3).setUsage(THREE.DynamicDrawUsage));
const facetMat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,transparent:true,opacity:.18,depthWrite:false});
const facetShell=new THREE.Mesh(facetGeo,facetMat);
facetShell.position.y=1.6;facetShell.frustumCulled=false;root.add(facetShell);
const faceSeeds=Array.from({length:facePositions.count/3},(_,i)=>(Math.sin(i*12.9898)*43758.5453)%1);
let focusAngle=-.75,focusTarget=-.75,focusHeight=0,focusCooldown=0;
function steerAttention(dt){
 focusCooldown=Math.max(0,focusCooldown-dt);
 if(onset>.68&&focusCooldown===0){focusTarget+=.42+Math.min(.64,flux*8+mid*.7);focusCooldown=1.8}
 focusAngle+=(focusTarget-focusAngle)*Math.min(1,dt*.15);
 focusHeight+=(THREE.MathUtils.clamp((mid-high)*.9,-.65,.65)-focusHeight)*Math.min(1,dt*.3);
}
function attentionFor(x,y,z){
 const a=Math.atan2(z,x),delta=Math.atan2(Math.sin(a-focusAngle),Math.cos(a-focusAngle));
 return Math.exp(-Math.pow(delta/.57,2)*2-Math.pow((y-focusHeight)/2,2));
}
function illuminateFaces(t,level){
 const v=facetGeo.attributes.color.array;
 for(let f=0;f<faceSeeds.length;f++){
  const k=f*9,x=(facePositions.array[k]+facePositions.array[k+3]+facePositions.array[k+6])/3;
  const y=(facePositions.array[k+1]+facePositions.array[k+4]+facePositions.array[k+7])/3;
  const z=(facePositions.array[k+2]+facePositions.array[k+5]+facePositions.array[k+8])/3;
  const focus=attentionFor(x,y,z);
  const transient=Math.max(0,Math.sin(f*.077-t*(.18+mid)));
  const bright=Math.min(.65,level*focus*(.1+.7*Math.pow(transient,8)+.17*impact));
  for(let k2=0;k2<3;k2++){const p=k+k2*3;v[p]=bright;v[p+1]=bright;v[p+2]=bright}
 }
 facetGeo.attributes.color.needsUpdate=true;
}
// Meteor showers: controlled streaks in a volume surrounding the viewer.
const METEORS=44,meteorGeo=new THREE.BufferGeometry();
const meteorPositions=new Float32Array(METEORS*6);
meteorGeo.setAttribute('position',new THREE.BufferAttribute(meteorPositions,3).setUsage(THREE.DynamicDrawUsage));
const meteorMat=new THREE.LineBasicMaterial({color:0xf8f8f8,transparent:true,opacity:0,depthWrite:false});
const meteorField=new THREE.LineSegments(meteorGeo,meteorMat);meteorField.frustumCulled=false;root.add(meteorField);
function updateMeteors(t,energy,visibility){
 const cx=Math.cos(focusAngle)*3.1,cz=Math.sin(focusAngle)*3.1;
 for(let i=0;i<METEORS;i++){
  const seed=i*2.3999632,cycle=(t*(.09+energy*.11)+i*.177)%1;
  const y=1.6+3.6-cycle*7.5,spread=.13+(i%11)*.065;
  const x=cx+Math.cos(seed)*spread,z=cz+Math.sin(seed)*spread,p=i*6,len=.07+.13*energy;
  meteorPositions[p]=x;meteorPositions[p+1]=y;meteorPositions[p+2]=z;
  meteorPositions[p+3]=x+.013;meteorPositions[p+4]=y+len;meteorPositions[p+5]=z+.009;
 }
 meteorGeo.attributes.position.needsUpdate=true;
 meteorMat.opacity=visibility*(.035+.18*energy+.08*impact);
}
// Black-hole / tunnel: nested rings, with no automatic artificial camera motion.
const tunnel=new THREE.Group(),tunnelRings=[];
for(let i=0;i<12;i++){
 const m=new THREE.Mesh(new THREE.TorusGeometry(1,.006,3,64),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
 tunnel.add(m);tunnelRings.push(m);
}
tunnel.position.set(0,1.6,-1.2);root.add(tunnel);
function updateTunnel(t,energy,visibility){
 for(let i=0;i<tunnelRings.length;i++){
  const p=(i/12+t*(.025+.018*energy))%1;
  const ring=tunnelRings[i];ring.position.z=-(.45+p*13);
  ring.scale.setScalar(.28+p*3.1);
  ring.rotation.z=t*.09+i*.33;
  ring.material.opacity=visibility*(.04+.22*energy)*Math.sin(Math.PI*p);
 }
}
// Blob particles: volumetric clusters, not continuous small floating dots.
const BLOB_N=96,blobGeo=new THREE.IcosahedronGeometry(.09,1);
const blobMat=new THREE.MeshBasicMaterial({color:0xeeeeee,transparent:true,opacity:0,depthWrite:false});
const blobCloud=new THREE.InstancedMesh(blobGeo,blobMat,BLOB_N);
blobCloud.frustumCulled=false;root.add(blobCloud);
const blobObject=new THREE.Object3D();
function updateBlobs(t,energy,visibility){
 for(let i=0;i<BLOB_N;i++){
  const group=i%2,seed=i*2.39996,radial=.12+(i%23)*.04;
  const center=focusAngle+(group-.5)*.24+t*.013;
  const r=2.5+Math.sin(group+t*.14)*.5;
  blobObject.position.set(Math.cos(center)*r+Math.cos(seed)*radial,
    1.6+Math.sin(center*1.3)*1.6+Math.sin(seed*.7)*radial,
    Math.sin(center)*r+Math.sin(seed)*radial);
  const scale=(.1+.9*Math.max(.05,energy)+.5*impact)*(.25+(i%7)/7);
  blobObject.scale.setScalar(scale);blobObject.rotation.set(t*.1,seed,0);
  blobObject.updateMatrix();blobCloud.setMatrixAt(i,blobObject.matrix);
 }
 blobCloud.instanceMatrix.needsUpdate=true;
 blobMat.opacity=visibility*(.05+.23*energy);
}

let tactileEnergy=0,tactileSpread=0,tactileX=0,tactileY=0;
function deformWireField(t,pressure,texture){
 const a=fieldGeo.attributes.position.array;
 const tension=.12+.82*pressure+.7*texture+.65*tactileEnergy;
 // True immersive 3D wire membrane, not a plane facing the viewer.
 for(let i=0;i<a.length;i+=3){
  const bx=fieldBase[i],by=fieldBase[i+1],bz=fieldBase[i+2];
  const norm=Math.hypot(bx,by,bz)||1;
  const phi=Math.atan2(bz,bx),elevation=Math.asin(by/norm);
  const harmonic=Math.sin(phi*(act===4?14:7)+t*(.26+texture*.8))*Math.cos(elevation*(act===4?12:5)-t*.23);
  const localGesture=Math.exp(-Math.pow(phi-tactileX*2,2)*.65);
  const radius=norm+harmonic*tension*(act===4?.96:.58)+localGesture*tactileEnergy*.55;
  a[i]=bx/norm*radius;a[i+1]=by/norm*radius;a[i+2]=bz/norm*radius;
 }
 fieldGeo.attributes.position.needsUpdate=true;
 fieldMat.opacity=Math.min(.65,(act===2||act===3||act===4||act===6?.16:.018)+(act===2||act===4?.39:.16)*texture+.12*tactileEnergy);
}
const GOLD=Math.PI*(3-Math.sqrt(5));
const P=1100,particleArray=new Float32Array(P*3),particleDirections=[];
for(let i=0;i<P;i++){
 const y=1-2*(i+.5)/P,a=i*GOLD,c=Math.sqrt(1-y*y);
 particleDirections.push(new THREE.Vector3(c*Math.cos(a),y,c*Math.sin(a)));
}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(particleArray,3).setUsage(THREE.DynamicDrawUsage));
const particleMaterial=new THREE.PointsMaterial({color:0xf3f3f3,size:.018,transparent:true,opacity:.4,depthWrite:false});
const particleMesh=new THREE.Points(pg,particleMaterial);root.add(particleMesh);
// Expanding spectral shock fronts: pulses are initiated by real transients,
// then decay as travelling 3D geometry rather than flickering on every FFT frame.
const shocks=[];
for(let i=0;i<5;i++){
 const g=new THREE.TorusGeometry(1,.003,4,128);
 const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
 m.position.set(0,1.6,0);root.add(m);shocks.push({mesh:m,age:100});
}
let previousShock=0;
function driveShock(dt){
 if(onset>.76&&animationT-previousShock>.55){
  const shock=shocks.reduce((a,b)=>a.age>b.age?a:b);
  shock.age=0;previousShock=animationT;
  shock.mesh.rotation.set(.4+textureMemory*.7,animationT*.17,animationT*.11);
 }
 for(const shock of shocks){
  shock.age+=dt;
  shock.mesh.scale.setScalar(.4+shock.age*1.85);
  shock.mesh.material.opacity=shock.age<2.7&&act===2?Math.pow(Math.max(0,1-shock.age/2.7),2)*(.04+.13*impact):0;
 }
}

const R=9,SEG=108,SIDES=4,filaments=[];
for(let i=0;i<R;i++){
 const geo=new THREE.BufferGeometry(),v=new Float32Array((SEG+1)*(SIDES+1)*3),ids=[];
 geo.setAttribute('position',new THREE.BufferAttribute(v,3).setUsage(THREE.DynamicDrawUsage));

   vc.fillStyle='rgba(143,194,238,.6)';vc.fillRect(x-2,44-h,4,h*2);
  }
 }
 if(renderer.xr.isPresenting){updateHands(frame,dt);readQuest(dt)}
 if(entered){analyze(dt);animationT+=dt;evolve(dt)}
 renderer.render(scene,camera);
});
