
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>ATMOSPHERE XR — Oktopus Art Studio</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#020309;
 color:#fff;font-family:Arial,sans-serif
}
canvas{display:block}
#panel{
 position:fixed;top:14px;left:14px;
 z-index:10;width:min(310px,calc(100% - 28px));
 padding:16px;
 background:rgba(5,9,22,.84);
 border:1px solid #34435d;
 border-radius:12px;
 backdrop-filter:blur(12px)
}
h1{
 margin:0 0 5px;
 font-size:20px;letter-spacing:4px;
 font-weight:400
}
.subtitle{
 font-size:10px;letter-spacing:2px;
 color:#9caec9
}
.description{
 font-size:12px;line-height:1.6;
 color:#bdcbe0;margin:17px 0
}
button{
 background:#344f83;color:white;
 border:1px solid #6074a1;
 border-radius:7px;padding:12px;
 cursor:pointer;font-size:12px
}
#start{width:100%;letter-spacing:1px}
button:disabled{opacity:.55}
label{
 display:block;font-size:11px;
 color:#b7c8df;margin-top:16px
}
input[type=range]{
 width:100%;margin-top:9px;
 accent-color:#8daeff
}
#status{
 font-size:11px;color:#a8caff;
 margin-top:13px;line-height:1.5
}
#spotify{
 position:fixed;bottom:15px;left:15px;
 width:min(360px,calc(100% - 30px));
 z-index:20;
 display:none;
}
#spotify iframe{
 width:100%;height:152px;
 border:0;border-radius:12px
}
#hide{
 position:absolute;right:5px;top:-34px;
 padding:7px 12px;background:#14213b
}
#showSpotify{
 position:fixed;bottom:16px;left:16px;
 z-index:20;display:none
}
#hint{
 position:fixed;right:14px;bottom:16px;
 font-size:10px;color:#8193b4;
 z-index:5;pointer-events:none
}
</style>
</head>

<body>

<div id="panel">
 <h1>ATMOSPHERE</h1>
 <div class="subtitle">OKTOPUS ART STUDIO</div>

 <p class="description">
  Immersive generative environment.
  An audiovisual exploration of
  geometry, space and movement.
 </p>

 <button id="start">
  INICIAR EXPERIENCIA
 </button>

 <label>
  INTENSIDAD VISUAL
  <input id="intensity" type="range"
   min="0.2" max="3" step="0.1"
   value="1.3">
 </label>

 <div id="status">
  Experiencia preparada.
 </div>
</div>

<div id="spotify">
 <button id="hide">Ocultar</button>
 <iframe
  id="spotifyFrame"
  title="ATMOSPHERE — Spotify"
  src="about:blank"
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
  loading="lazy">
 </iframe>
</div>

<button id="showSpotify">
 MOSTRAR SPOTIFY
</button>

<div id="hint">
 ATMOSPHERE XR · GENERATIVE ENVIRONMENT
</div>

<script type="module">

import * as THREE from
'https://esm.sh/three@0.173.0';

const $=id=>document.getElementById(id);

const start=$('start');
const status=$('status');
const intensity=$('intensity');
const spotify=$('spotify');
const spotifyFrame=$('spotifyFrame');
const hide=$('hide');
const showSpotify=$('showSpotify');

const TRACK=
 '7JTEfJqz2rBNOkRB7A9w4K';

let started=false;
let elapsed=0;

// Spotify Embedded Player.
// No se accede a la señal de audio.
// La reproducción la controla Spotify.

function showPlayer(){
 spotify.style.display='block';
 showSpotify.style.display='none';
}

start.addEventListener('click',()=>{
 if(!started){
  started=true;
  spotifyFrame.src=
   'https://open.spotify.com/embed/track/'
   +TRACK+'?utm_source=generator';

  start.textContent='EXPERIENCIA ACTIVA';
  status.textContent=
   'Escena activa. Pulsa Play en Spotify.';
 }

 showPlayer();
});

hide.addEventListener('click',()=>{
 spotify.style.display='none';
 showSpotify.style.display='block';
});

showSpotify.addEventListener('click',showPlayer);

// THREE.JS

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020309);
scene.fog=new THREE.FogExp2(0x020309,.012);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,.01,150
);

camera.position.set(0,1.6,4);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:false,
 powerPreference:'high-performance'
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
);
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;

document.body.appendChild(renderer.domElement);

// LIGHTS

scene.add(new THREE.AmbientLight(
 0x627aff,1.2
));

const blueLight=new THREE.PointLight(
 0x55aaff,25,20
);
blueLight.position.set(3,4,2);
scene.add(blueLight);

const violetLight=new THREE.PointLight(
 0x7744ff,20,20
);
violetLight.position.set(-3,0,-2);
scene.add(violetLight);

// MAIN GROUP

const universe=new THREE.Group();
universe.position.set(0,1.6,-2);
scene.add(universe);

// CORE

const core=new THREE.Mesh(
 new THREE.IcosahedronGeometry(.65,4),
 new THREE.MeshPhysicalMaterial({
  color:0x567aff,
  metalness:.4,
  roughness:.18,
  wireframe:true,
  transparent:true,
  opacity:.75
 })
);

universe.add(core);

// INTERNAL GEOMETRY

const inner=new THREE.Mesh(
 new THREE.DodecahedronGeometry(.37,2),
 new THREE.MeshBasicMaterial({
  color:0x77bbff,
  transparent:true,
  opacity:.22,
  wireframe:true
 })
);

universe.add(inner);

// ORBITAL RINGS

const rings=[];

for(let i=0;i<7;i++){
 const radius=.95+i*.21;

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(
   radius,.007,6,150
  ),
  new THREE.MeshBasicMaterial({
   color:new THREE.Color().setHSL(
    .56+i*.025,.85,.65
   ),
   transparent:true,
   opacity:.48,
   depthWrite:false
  })
 );

 ring.rotation.x=i*.41;
 ring.rotation.y=i*.57;

 universe.add(ring);
 rings.push(ring);
}

// PARTICLES

const count=1600;
const positions=new Float32Array(count*3);
const original=new Float32Array(count*3);

for(let i=0;i<count;i++){
 const radius=1.8+Math.random()*7;
 const a=Math.random()*Math.PI*2;
 const z=Math.random()*2-1;
 const f=Math.sqrt(1-z*z);

 const x=radius*f*Math.cos(a);
 const y=radius*z;
 const zz=radius*f*Math.sin(a);

 positions[i*3]=x;
 positions[i*3+1]=y;
 positions[i*3+2]=zz;

 original[i*3]=x;
 original[i*3+1]=y;
 original[i*3+2]=zz;
}

const particleGeometry=
 new THREE.BufferGeometry();

particleGeometry.setAttribute(
 'position',
 new THREE.BufferAttribute(positions,3)
);

const particles=new THREE.Points(
 particleGeometry,
 new THREE.PointsMaterial({
  color:0x8aabff,
  size:.019,
  transparent:true,
  opacity:.65,
  depthWrite:false
 })
);

universe.add(particles);

// SECONDARY STRUCTURES

const satellites=[];

for(let i=0;i<12;i++){
 const mesh=new THREE.Mesh(
  new THREE.TetrahedronGeometry(
   .035+Math.random()*.055
  ),
  new THREE.MeshBasicMaterial({
   color:0x7bcfff,
   wireframe:true,
   transparent:true,
   opacity:.65
  })
 );

 mesh.userData={
  radius:1.5+Math.random()*2.3,
  speed:.12+Math.random()*.25,
  phase:Math.random()*Math.PI*2,
  height:(Math.random()-.5)*2
 };

 universe.add(mesh);
 satellites.push(mesh);
}

// ANIMATION
// Modulación generativa independiente
// del contenido de Spotify.

const clock=new THREE.Clock();

renderer.setAnimationLoop(()=>{
 const delta=Math.min(clock.getDelta(),.05);

 if(started)elapsed+=delta;

 const t=elapsed;
 const amount=parseFloat(intensity.value);

 if(started){

  const slow=
   Math.sin(t*.42)*.5+.5;

  const medium=
   Math.sin(t*1.1+1.5)*.5+.5;

  const pulse=
   Math.pow(
    Math.sin(t*1.8)*.5+.5,3
   );

  const modulation=
   (slow*.4+medium*.35+pulse*.25)
   *amount;

  core.scale.setScalar(
   1+modulation*.36
  );

  core.rotation.x+=delta*.11;
  core.rotation.y+=delta*.19;

  inner.rotation.x-=delta*.16;
  inner.rotation.z+=delta*.12;

  inner.scale.setScalar(
   1+modulation*.15
  );

  rings.forEach((ring,i)=>{
   ring.rotation.z+=
    delta*(.045+i*.013);

   ring.rotation.y+=
    delta*(.03+i*.009);

   ring.scale.setScalar(
    1+modulation*(.06+i*.008)
   );

   ring.material.opacity=
    Math.min(
     .9,.24+modulation*.13
    );
  });

  particles.rotation.y+=delta*.008;
  particles.rotation.x+=delta*.003;

  particles.material.opacity=
   Math.min(
    1,.35+modulation*.15
   );

  satellites.forEach((mesh,i)=>{
   const d=mesh.userData;

   const a=t*d.speed+d.phase;

   mesh.position.set(
    Math.cos(a)*d.radius,
    d.height+Math.sin(t*.4+i)*.2,
    Math.sin(a)*d.radius
   );

   mesh.rotation.x+=delta*.3;
   mesh.rotation.y+=delta*.2;
  });

  blueLight.intensity=
   16+modulation*8;

  violetLight.intensity=
   12+modulation*7;

  universe.rotation.y=
   Math.sin(t*.045)*.12;
 }

 renderer.render(scene,camera);
});

// RESIZE

window.addEventListener('resize',()=>{
 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,innerHeight
 );
});

</script>
</body>
</html>
