<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATMOSPHERE — Immersive Soundscape</title><style>body{margin:0;background:#03040a;color:#eaf3ff;font:13px system-ui}#panel{position:fixed;top:16px;left:16px;z-index:10;background:#080c18cc;border:1px solid #6688aa55;border-radius:12px;padding:16px;max-width:280px;backdrop-filter:blur(12px)}h1{font-size:16px;letter-spacing:.2em;margin:0 0 5px}p{opacity:.7;line-height:1.5}button,input{margin-top:8px}button{background:#142c45;color:white;border:1px solid #5785a3;border-radius:6px;padding:9px;cursor:pointer}#status{font-size:11px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/","xrblocks":"https://cdn.jsdelivr.net/gh/google/xrblocks@build/xrblocks.js","xrblocks/addons/":"https://cdn.jsdelivr.net/gh/google/xrblocks@build/addons/"}}</script></head><body><div id="panel"><h1>ATMOSPHERE</h1><p>Immersive Soundscape · Oktopus Art Studio</p><button id="play">Iniciar audio</button><br><label>Archivo de audio <input type="file" id="file" accept="audio/*"></label><p>Intensidad <input type="range" id="intensity" min="0" max="3" step="0.1" value="1.3"></p><p id="status">Cargando experiencia…</p></div><audio id="audio" src="atmosphere.mp3" crossorigin="anonymous" loop></audio><script type="module">import * as THREE from 'three';import * as xb from 'xrblocks';let analyser,ctx,source,levels=new Uint8Array(128),intensity=1.3;const audio=document.getElementById('audio'),status=document.getElementById('status');document.getElementById('intensity').oninput=e=>intensity=+e.target.value;document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(f){audio.src=URL.createObjectURL(f);status.textContent='Audio cargado: '+f.name}};document.getElementById('play').onclick=async()=>{try{if(!ctx){ctx=new AudioContext();analyser=ctx.createAnalyser();analyser.fftSize=256;source=ctx.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ctx.destination)}await ctx.resume();if(audio.paused){await audio.play();document.getElementById('play').textContent='Pausar audio';status.textContent='Audio activo'}else{audio.pause();document.getElementById('play').textContent='Reanudar audio'}}catch(e){status.textContent='Selecciona tu archivo de audio para reproducirlo.'}};
class Atmosphere extends xb.Script{init(){this.add(new THREE.HemisphereLight(0x789adf,0x090517,2));const center=new THREE.Group();center.position.set(0,xb.user.height-0.15,-Math.max(2,xb.user.objectDistance));this.add(center);this.center=center;this.core=new THREE.Mesh(new THREE.IcosahedronGeometry(.48,5),new THREE.MeshPhysicalMaterial({color:0x548bcb,wireframe:true,transparent:true,opacity:.65,depthWrite:false}));center.add(this.core);this.rings=[];for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.TorusGeometry(.7+i*.17,.004+i*.0015,6,180),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(.54+i*.018,.65,.5),transparent:true,opacity:.36,depthWrite:false}));m.rotation.set(i*.39,i*.63,i*.24);center.add(m);this.rings.push(m)}const count=950,positions=new Float32Array(count*3),sizes=[];for(let i=0;i<count;i++){const r=1.1+Math.random()*4.3,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);positions[i*3]=r*Math.sin(b)*Math.cos(a);positions[i*3+1]=r*Math.cos(b)*.6;positions[i*3+2]=r*Math.sin(b)*Math.sin(a);sizes.push(Math.random())}let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));this.particles=new THREE.Points(geo,new THREE.PointsMaterial({color:0x82b6ed,size:.016,transparent:true,opacity:.68,depthWrite:false}));center.add(this.particles);status.textContent='Escena lista. Carga atmosphere.mp3 y pulsa Iniciar audio.'}update(){if(analyser)analyser.getByteFrequencyData(levels);let bass=0,mid=0,high=0;for(let i=0;i<12;i++)bass+=levels[i];for(let i=12;i<50;i++)mid+=levels[i];for(let i=50;i<110;i++)high+=levels[i];bass/=12*255;mid/=38*255;high/=60*255;const t=performance.now()*.001;this.core.rotation.y+=.002+mid*.018;this.core.rotation.x+=.001;let s=1+intensity*bass*.55+Math.sin(t*.4)*.04;this.core.scale.setScalar(s);this.core.material.opacity=.28+mid*.55;this.rings.forEach((r,i)=>{r.rotation.z+=.001*(i%2?1:-1)+high*.008;r.rotation.y+=.0006;r.scale.setScalar(1+bass*intensity*(.12+i*.025))});this.particles.rotation.y+=.00035+high*.002;this.particles.material.opacity=.3+Math.min(.65,mid*intensity)}onSelectEnd(){this.rings.forEach(r=>r.rotation.x+=.2)}}document.addEventListener('DOMContentLoaded',async()=>{try{xb.add(new Atmosphere());const opt=new xb.Options();opt.xrButton.showEnterSimulatorButton=true;await xb.init(opt)}catch(e){status.textContent='Error XR: '+e.message;console.error(e)}});</script></body></html>
