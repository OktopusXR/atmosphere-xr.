<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATMOSPHERE — Oktopus Art Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040b;color:#e9f3ff;font:13px system-ui,Arial}
canvas{display:block}button{color:#e6f3ff;background:#14243fbc;border:1px solid #6683a4;border-radius:7px;padding:11px 17px;letter-spacing:.12em;cursor:pointer}
#intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;background:rgba(2,5,14,.42);backdrop-filter:blur(8px)}
#title{font-size:clamp(40px,9vw,104px);font-weight:250;letter-spacing:.15em;line-height:1.1;text-shadow:0 0 22px #31547a88}
#kicker{font-size:10px;letter-spacing:.37em;margin-bottom:16px;color:#9ab3ca}
#introEn{font-size:clamp(19px,3vw,30px);max-width:720px;margin-top:24px;line-height:1.45}
#introEs{font-size:clamp(13px,2vw,18px);color:#a0b8d0;margin-top:12px;max-width:720px}
#introAuthor{margin-top:20px;line-height:1.8;font-size:12px;color:#a6bfd4}
#introAuthor a,.links a{color:#add5ff;text-decoration:none}#intro button{margin-top:25px}
#voiceWave{display:none;width:min(540px,75vw);height:68px;margin-top:17px}
#controlsBtn{display:none;position:fixed;z-index:12;left:12px;bottom:12px}
#controls{display:none;position:fixed;z-index:11;left:12px;bottom:66px;width:min(286px,calc(100% - 24px));padding:15px;background:#061024d9;border:1px solid #3c5874;border-radius:10px;backdrop-filter:blur(10px)}
#controls label{display:block;margin-top:14px;font-size:11px;color:#aac4dd}#controls input{width:100%;accent-color:#7aaddd}
#controls p{font-size:11px;color:#97aec8;line-height:1.5}#controls .links{margin-top:12px;font-size:11px;display:flex;gap:14px}
#xrButton{position:fixed;bottom:14px;right:14px;z-index:13}#skip{background:transparent;font-size:10px;border:0}
</style></head><body>
<div id="intro">
 <div id="kicker">TECHNO POESIS</div><div id="title">ATMOSPHERE</div>
 <div id="introEn"></div><div id="introEs"></div>
 <canvas id="voiceWave" width="640" height="88"></canvas>
 <div id="introAuthor" style="display:none">Ricardo P. Tapia Fernández · Oktopus Art Studio<br>Art, nature and technology · <a href="https://www.instagram.com/oktopus.art/" target="_blank" rel="noopener">@oktopus.art ↗</a></div>
 <button id="startIntro">START</button><button id="skip" style="display:none">SKIP INTRO</button><button id="enter" style="display:none">ENTER EXPERIENCE</button>
</div>
<button id="controlsBtn">CONTROLS</button>
<div id="controls"><b>ATMOSPHERE</b><p id="status">Ready</p><button id="pause">PAUSE / RESUME</button>
 <label>BASS · <span id="bassVal">0</span> dB<input id="bass" type="range" min="-12" max="12" step="1" value="0"></label>
 <label>MID · <span id="midVal">0</span> dB<input id="mid" type="range" min="-12" max="12" step="1" value="0"></label>
 <label>HIGH · <span id="highVal">0</span> dB<input id="high" type="range" min="-12" max="12" step="1" value="0"></label>
 <label>VISUAL RESPONSE<input id="sensitivity" type="range" min=".3" max="2.8" step=".1" value="1.5"></label>
 <div class="links"><a href="https://open.spotify.com/track/7JTEfJqz2rBNOkRB7A9w4K" target="_blank" rel="noopener">Spotify ↗</a><a href="https://music.apple.com/us/album/atmosphere-single/6815019097" target="_blank" rel="noopener">Apple Music · Dolby Atmos ↗</a></div>
</div>
<div id="xrButton"></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.173.0';
const $=id=>document.getElementById(id);
const status=$('status'),button=$('controlsBtn');
let entered=false,eq=[0,0,0],selected=0,vrPanelShown=true;
const controlIds=['bass','mid','high'],eqLabels=['bassVal','midVal','highVal'];
const music=new Audio('./atmosphereADM_binaural.mp3');music.preload='metadata';
music.crossOrigin='anonymous';
const narration=new Audio('./atmosphere-intro.mp3');narration.preload='auto';
let context,filters,analyser,source,spectrum,timeData,previous,low=0,mid=0,high=0,rms=0,flux=0;
const narrative=[
 ['Invisible networks connect all forms of life.','Redes invisibles conectan todas las formas de vida.'],
 ['From body to Earth. From Earth to cosmos.','Del cuerpo a la Tierra. De la Tierra al cosmos.'],
 ['Listen. You are part of this resonance.','Escucha. Eres parte de esta resonancia.']
];
let introStarted=false,introDone=false,voiceLive=false,narrationFallback=false;
const introText=$('introEn'),introSub=$('introEs'),voiceCanvas=$('voiceWave'),vc=voiceCanvas.getContext('2d');
function caption(n){introText.textContent=narrative[n]?.[0]||'';introSub.textContent=narrative[n]?.[1]||''}
function finishIntro(){
 if(introDone)return;
 introDone=true;voiceLive=false;narration.pause();voiceCanvas.style.display='none';
 if('speechSynthesis' in window)speechSynthesis.cancel();
 introText.textContent='';introSub.textContent='';
 $('introAuthor').style.display='block';$('startIntro').style.display='none';
 $('skip').style.display='none';$('enter').style.display='block';
}
function playSpeechFallback(){
 narrationFallback=true;
 if(!('speechSynthesis' in window))return;
 const u=new SpeechSynthesisUtterance(narrative.map(x=>x[0]).join(' ... '));
 u.lang='en-US';u.rate=.8;u.pitch=1.06;u.onstart=()=>{voiceLive=true};
 u.onend=()=>{voiceLive=false};speechSynthesis.cancel();speechSynthesis.speak(u);
}
$('startIntro').onclick=()=>{
 if(introStarted)return;
 introStarted=true;voiceLive=true;
 $('startIntro').style.display='none';$('skip').style.display='block';
 voiceCanvas.style.display='block';caption(0);
 // HTML media, rather than browser speech synthesis, works in Quest Browser.
 const attempt=narration.play();
 attempt.catch(()=>{playSpeechFallback()});
 const steps=[4500,9000];steps.forEach((ms,i)=>setTimeout(()=>{if(!introDone)caption(i+1)},ms));
 setTimeout(finishIntro,14600);
};
narration.onended=()=>{voiceLive=false;finishIntro()};
narration.onerror=()=>{if(introStarted&&!introDone&&!narrationFallback)playSpeechFallback()};
$('skip').onclick=finishIntro;
let voiceTime=0;
function drawNarration(dt){
 if(!voiceLive||introDone)return;
 voiceTime+=dt;
 vc.clearRect(0,0,640,88);
 // The narration is a separate media file; no fake frequency spectrum is claimed.
 for(let i=0;i<62;i++){
  const x=(i+.5)*640/62,window=Math.pow(Math.max(0,1-Math.abs(i-31)/32),1.5);
  const value=(narrationFallback?.35:.6)*window*(.4+.25*Math.sin(i*.64+voiceTime*11)+.18*Math.sin(i*.25-voiceTime*6));
  const h=4+value*68;vc.fillStyle='rgba(164,215,255,'+(.25+window*.65)+')';
  vc.fillRect(x-2,44-h*.5,4,h);
 }
}
function setEQ(){controlIds.forEach((id,i)=>{$(id).value=eq[i];$(eqLabels[i]).textContent=(eq[i]>0?'+':'')+eq[i];if(filters)filters[i].gain.value=eq[i]});paintPanel()}
controlIds.forEach((id,i)=>$(id).addEventListener('input',()=>{eq[i]=+$(id).value;selected=i;setEQ()}));
button.onclick=()=>{const show=$('controls').style.display!=='block';$('controls').style.display=show?'block':'none';button.textContent=show?'HIDE CONTROLS':'CONTROLS'};
$('pause').onclick=async()=>{if(!context)return;if(music.paused){await context.resume();await music.play()}else music.pause()};
music.onended=()=>{status.textContent='Experience completed';music.currentTime=0};
async function initSound(){
 if(!context){
  context=new (window.AudioContext||window.webkitAudioContext)();
  filters=[
   new BiquadFilterNode(context,{type:'lowshelf',frequency:160}),
   new BiquadFilterNode(context,{type:'peaking',frequency:950,Q:.75}),
   new BiquadFilterNode(context,{type:'highshelf',frequency:2700})
  ];
  analyser=context.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.65;
  spectrum=new Uint8Array(analyser.frequencyBinCount);previous=new Uint8Array(spectrum.length);
  timeData=new Float32Array(analyser.fftSize);
  source=context.createMediaElementSource(music);source.connect(filters[0]);
  filters[0].connect(filters[1]);filters[1].connect(filters[2]);
  filters[2].connect(analyser);analyser.connect(context.destination);setEQ();
 }
 await context.resume();
}
function band(from,to){
 const ny=context.sampleRate/2;let l=Math.floor(from/ny*spectrum.length),h=Math.ceil(to/ny*spectrum.length),sum=0;
 l=Math.max(0,l);h=Math.min(spectrum.length,Math.max(h,l+1));
 for(let i=l;i<h;i++)sum+=spectrum[i];return sum/(h-l)/255;
}
let avgFlux=.01,onset=0,onsetCooldown=0,quiet=0;
// Deterministic sound dramaturgy. Stages respond to longer-term audio conditions;
// stage changes are held, not retriggered by every small FFT fluctuation.
const STAGES=['SUSPENSION','AWAKENING','INTERWEAVE','EXPANSION','DISSOLUTION'];
let stage=0,stageHold=0,stageMix=0,energyMemory=0,textureMemory=0,gestureMemory=0;
function updateDramaturgy(dt){
 const energy=Math.min(1,rms*5.7);
 const texture=Math.min(1,mid*1.5+high*.7);
 energyMemory+=(energy-energyMemory)*Math.min(1,dt*.28);
 textureMemory+=(texture-textureMemory)*Math.min(1,dt*.45);
 gestureMemory+=(onset-gestureMemory)*Math.min(1,dt*1.6);
 const playing=!music.paused&&!music.ended;
 stageHold+=dt;
 if(!playing)return;
 if(stageHold<8)return;
 // Entry, sustain, and release thresholds produce meaningful stable states.
 let next=stage;
 if(stage===0&&energyMemory>.14)next=1;
 else if(stage===1&&textureMemory>.24)next=2;
 else if(stage===2&&energyMemory>.32&&gestureMemory>.035)next=3;
 else if(stage===3&&(energyMemory<.22||textureMemory<.14))next=4;
 else if(stage===4&&energyMemory>.28&&textureMemory>.22)next=2;
 else if(stage===4&&energyMemory<.10)next=0;
 else if(stage===2&&energyMemory<.12)next=4;
 if(next!==stage){stage=next;stageHold=0}
 stageMix+=(stage-stageMix)*Math.min(1,dt*.32);
}

function analyze(dt){
 if(!analyser||music.paused||music.ended){
  low*=.97;mid*=.97;high*=.97;rms*=.97;onset*=.92;return;
 }
 analyser.getByteFrequencyData(spectrum);analyser.getFloatTimeDomainData(timeData);
 let sum=0,novel=0,count=0;
 for(let i=0;i<timeData.length;i+=4)sum+=timeData[i]*timeData[i];
 for(let i=2;i<Math.min(550,spectrum.length);i+=3){
  novel+=Math.max(0,spectrum[i]-previous[i])/255;count++;
 }
 previous.set(spectrum);
 const fluxNow=novel/Math.max(1,count);avgFlux=avgFlux*.98+fluxNow*.02;
 rms+=(Math.sqrt(sum/(timeData.length/4))-rms)*.16;
 low+=(band(20,160)-low)*.12;mid+=(band(160,2000)-mid)*.1;high+=(band(2000,12000)-high)*.1;
 onsetCooldown=Math.max(0,onsetCooldown-dt);
 if(fluxNow>Math.max(.033,avgFlux*2.2)&&rms>.018&&onsetCooldown<=0){onset=1;onsetCooldown=1.1}
 onset*=Math.exp(-dt*1.9);flux+=(fluxNow-flux)*.13;
 quiet+=((rms<.026?1:0)-quiet)*.03;
}
// Minimal sonic ecology: one filament network, one particulate shell, sparse tetrahedra.
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02040b);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,90);
camera.position.set(0,1.6,0);scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);
const root=new THREE.Group();scene.add(root);
const GOLD=Math.PI*(3-Math.sqrt(5));
const P=680,particleArray=new Float32Array(P*3),particleDirections=[];
for(let i=0;i<P;i++){
 const y=1-2*(i+.5)/P,a=i*GOLD,c=Math.sqrt(1-y*y);
 particleDirections.push(new THREE.Vector3(c*Math.cos(a),y,c*Math.sin(a)));
}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(particleArray,3).setUsage(THREE.DynamicDrawUsage));
const particleMaterial=new THREE.PointsMaterial({color:0xb0d6ff,size:.018,transparent:true,opacity:.4,depthWrite:false});
const particleMesh=new THREE.Points(pg,particleMaterial);root.add(particleMesh);
const R=8,SEG=108,SIDES=4,filaments=[];
for(let i=0;i<R;i++){
 const geo=new THREE.BufferGeometry(),v=new Float32Array((SEG+1)*(SIDES+1)*3),ids=[];
 geo.setAttribute('position',new THREE.BufferAttribute(v,3).setUsage(THREE.DynamicDrawUsage));
 for(let j=0;j<SEG;j++)for(let k=0;k<SIDES;k++){const a=j*(SIDES+1)+k,b=a+SIDES+1;ids.push(a,b,a+1,b,b+1,a+1)}
 geo.setIndex(ids);
 const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x8cbde1,transparent:true,opacity:.24,depthWrite:false,side:THREE.DoubleSide}));
 mesh.frustumCulled=false;root.add(mesh);filaments.push(mesh);
}
const tetraGeo=new THREE.TetrahedronGeometry(.12),tetraMat=new THREE.MeshBasicMaterial({color:0x9ad5ff,transparent:true,opacity:.16,wireframe:true,depthWrite:false});
const T=3,tetra=new THREE.InstancedMesh(tetraGeo,tetraMat,T),dummy=new THREE.Object3D();root.add(tetra);tetra.frustumCulled=false;
let animationT=0;
function evolve(dt){
 updateDramaturgy(dt);
 const gain=+$('sensitivity').value;
 const lo=low*gain,mi=mid*gain,hi=high*gain;
 const phase=THREE.MathUtils.clamp(stageMix,0,4);
 // Continuous tension is measured over seconds, not randomized per object.
 const pressure=THREE.MathUtils.clamp(energyMemory*1.8,0,1);
 const weave=THREE.MathUtils.clamp(textureMemory*1.5,0,1);
 const opening=THREE.MathUtils.smoothstep(phase,1.1,2.9);
 const dispersal=THREE.MathUtils.smoothstep(phase,3.2,4);
 const holding=(1-dispersal)*(.12+.88*opening);
 const breath=1+.22*pressure+.12*lo;
 const fold=.08+.48*weave*holding;
 const ignition=onset*.4;
 for(let i=0;i<P;i++){
  const d=particleDirections[i];
  // Stable Fibonacci distribution, slight radial motion from actual spectral texture.
  const radial=(4.4+(i%5)*.28)*(1+.2*pressure);
  const released=(.1+.18*hi+.42*dispersal);
  particleArray[i*3]=d.x*radial+d.z*released;
  particleArray[i*3+1]=1.6+d.y*radial;
  particleArray[i*3+2]=d.z*radial-d.x*released;
 }
 pg.attributes.position.needsUpdate=true;
 particleMaterial.opacity=.035+.22*holding+.12*ignition;
 particleMaterial.size=.012+.017*hi;
 filaments.forEach((mesh,i)=>{
  const v=mesh.geometry.attributes.position.array;
  const angle=i*GOLD,ct=Math.cos(angle),st=Math.sin(angle);
  const radius=(2.25+i%3*.48)*breath;
  const topology=(i%2===0?1:-1);
  for(let j=0;j<=SEG;j++){
   const a=j/SEG*Math.PI*2;
   // Braids cross without independently drifting; midrange changes topology.
   const deformation=fold*Math.sin(a*3+topology*phase*.7);
   const x=radius*Math.cos(a)+deformation*Math.sin(2*a);
   const y=radius*.51*Math.sin(a)+deformation*.35*Math.cos(a*2);
   const z=radius*.34*Math.sin(2*a+i*.3)+deformation*Math.cos(a);
   const X=x*ct-y*st,Y=x*st+y*ct;
   for(let k=0;k<=SIDES;k++){
    const p=(j*(SIDES+1)+k)*3,q=k/SIDES*Math.PI*2;
    const thickness=.007+.01*pressure+.024*ignition;
    v[p]=X+Math.cos(q)*thickness;
    v[p+1]=1.6+Y+Math.sin(q)*thickness;
    v[p+2]=z-1.5+Math.sin(q)*thickness;
   }
  }
  mesh.geometry.attributes.position.needsUpdate=true;
  // Suppress decorative concurrent layers during suspension and dissolution.
  mesh.material.opacity=Math.min(.60,(.10+.32*holding)*(1-.75*dispersal)+.12*ignition);
 });
 for(let i=0;i<T;i++){
  const y=1-2*(i+.5)/T,a=i*GOLD,c=Math.sqrt(1-y*y),r=3.3;
  dummy.position.set(r*c*Math.cos(a),1.6+r*y,r*c*Math.sin(a));
  dummy.rotation.set(0,phase*.12+i,0);
  dummy.scale.setScalar(.15+.85*ignition);dummy.updateMatrix();tetra.setMatrixAt(i,dummy.matrix);
 }
 tetra.instanceMatrix.needsUpdate=true;
 tetraMat.opacity=Math.min(.22,ignition*.3);
 // The visual narrative's identity is driven by sustained texture and events.
 if(renderer.xr.isPresenting&&hud.visible&&Math.abs(stageMix-stage)>.05)paintPanel();
}

function openControlPanel(){ $('controls').style.display='none';button.style.display='block';button.textContent='CONTROLS'}
$('enter').onclick=async()=>{
 try{
  // Use the direct click to authorize media playback before async continuation.
  const pending=initSound();
  const play=music.play();
  await Promise.all([pending,play]);
  entered=true;narration.pause();$('intro').style.display='none';openControlPanel();
  status.textContent='Sonic ecology · live FFT';
 }catch(err){introSub.textContent='Unable to start sound: '+err.message}
};
// VR HUD follows viewpoint, offset to the left, always visible and never front-center.
const panelCanvas=document.createElement('canvas');panelCanvas.width=640;panelCanvas.height=384;
const panelCtx=panelCanvas.getContext('2d'),panelTexture=new THREE.CanvasTexture(panelCanvas);
const hud=new THREE.Mesh(new THREE.PlaneGeometry(.63,.38),new THREE.MeshBasicMaterial({map:panelTexture,transparent:true,depthTest:false}));
hud.renderOrder=100;hud.visible=false;scene.add(hud);
function paintPanel(){
 panelCtx.clearRect(0,0,640,384);panelCtx.fillStyle='rgba(4,11,27,.79)';panelCtx.fillRect(0,0,640,384);
 panelCtx.strokeStyle='#4b6484';panelCtx.strokeRect(2,2,636,380);
 panelCtx.fillStyle='#c5dcf2';panelCtx.font='27px Arial';panelCtx.fillText('ATMOSPHERE · EQ',22,44);
 panelCtx.fillStyle='#97adc4';panelCtx.font='17px Arial';panelCtx.fillText('L trigger: band    R stick: gain',22,76);
 ['BASS','MID','HIGH'].forEach((name,i)=>{
  const y=128+i*83;panelCtx.fillStyle=i===selected?'#d3e9ff':'#7994af';panelCtx.font='21px Arial';panelCtx.fillText(name,22,y);
  panelCtx.fillStyle='#253853';panelCtx.fillRect(110,y-16,368,12);
  panelCtx.fillStyle='#93c9f3';panelCtx.fillRect(110,y-16,368*(eq[i]+12)/24,12);
  panelCtx.fillText((eq[i]>0?'+':'')+eq[i]+' dB',495,y);
 });
 panelCtx.fillStyle='#8ba9c9';panelCtx.font='17px Arial';panelCtx.fillText('L stick: response  · '+STAGES[stage],22,367);panelTexture.needsUpdate=true;
}
paintPanel();
const ctrl0=renderer.xr.getController(0),ctrl1=renderer.xr.getController(1);scene.add(ctrl0,ctrl1);
for(const ctrl of [ctrl0,ctrl1]){
 ctrl.addEventListener('selectstart',(event)=>{
  if(!renderer.xr.isPresenting||event.data?.handedness!=='left')return;
  selected=(selected+1)%3;paintPanel();
 });
}
let inputCooldown=0;
function readQuest(dt){
 if(!renderer.xr.isPresenting)return;
 inputCooldown=Math.max(0,inputCooldown-dt);
 const session=renderer.xr.getSession();if(!session)return;
 for(const src of session.inputSources){
  if(!src.gamepad)continue;
  const a=src.gamepad.axes,x=a.length>=4?a[2]:a[0]||0,y=a.length>=4?a[3]:a[1]||0;
  if(src.handedness==='right'&&Math.abs(x)>.4&&inputCooldown===0){eq[selected]=THREE.MathUtils.clamp(eq[selected]+Math.sign(x),-12,12);setEQ();inputCooldown=.13}
  if(src.handedness==='left'&&Math.abs(y)>.4){$('sensitivity').value=THREE.MathUtils.clamp(+$('sensitivity').value-y*dt*.5,.3,2.8)}
 }
 // Lateral HUD aligned to the headset, updated every frame.
 const xrCam=renderer.xr.getCamera(),pos=new THREE.Vector3(),quat=new THREE.Quaternion();
 xrCam.getWorldPosition(pos);xrCam.getWorldQuaternion(quat);
 hud.position.copy(pos).add(new THREE.Vector3(-.84,-.22,-1.2).applyQuaternion(quat));
 hud.quaternion.copy(quat);hud.visible=true;
}
async function setupVR(){
 if(!navigator.xr||!window.isSecureContext)return;
 try{
  if(!await navigator.xr.isSessionSupported('immersive-vr'))return;
  const b=document.createElement('button');b.textContent='ENTER VR';$('xrButton').appendChild(b);
  b.onclick=async()=>{
   if(renderer.xr.isPresenting){await renderer.xr.getSession().end();return}
   try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    await renderer.xr.setSession(session);b.textContent='EXIT VR';
   }catch(err){status.textContent=err.message}
  };
  renderer.xr.addEventListener('sessionstart',()=>{hud.visible=true;$('controls').style.display='none';button.style.display='none'});
  renderer.xr.addEventListener('sessionend',()=>{hud.visible=false;b.textContent='ENTER VR';if(entered)openControlPanel()});
 }catch(e){/* Standard 3D desktop view remains available. */}
}
setupVR();
let voiceClock=0;
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(.05,clock.getDelta());
 voiceClock+=dt;
 if(voiceLive){
  vc.clearRect(0,0,640,88);
  for(let i=0;i<48;i++){
   const x=(i+.5)*640/48;
   const h=(4+26*(.5+.4*Math.sin(voiceClock*12+i*.45)))*Math.max(.15,1-Math.abs(i-24)/27);
   vc.fillStyle='rgba(143,194,238,.6)';vc.fillRect(x-2,44-h,4,h*2);
  }
 }
 if(entered){analyze(dt);animationT+=dt;evolve(dt);readQuest(dt)}
 renderer.render(scene,camera);
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
