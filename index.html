<script type="module">
import * as THREE from 'https://esm.sh/three@0.173.0';
const $=id=>document.getElementById(id);
const status=$('status'),button=$('controlsBtn');
let entered=false,eq=[0,0,0],selected=0,vrPanelShown=true;
const controlIds=['bass','mid','high'],eqLabels=['bassVal','midVal','highVal'];
const music=new Audio('./atmosphereADM_binaural.mp3');music.preload='metadata';
music.crossOrigin='anonymous';
const narration=new Audio('./atmosphere-intro.ogg');narration.preload='auto';
let context,filters,analyser,source,spectrum,timeData,previous,low=0,mid=0,high=0,rms=0,flux=0;
const narrative=[
 ['Invisible networks connect all forms of life.','Redes invisibles conectan todas las formas de vida.'],
 ['From body to Earth. From Earth to cosmos.','Del cuerpo a la Tierra. De la Tierra al cosmos.'],
 ['Listen. You are part of this resonance.','Escucha. Eres parte de esta resonancia.']
];
let introStarted=false,introDone=false,voiceLive=false,narrationFallback=false;
const introText=$('introEn'),introSub=$('introEs'),voiceCanvas=$('voiceWave'),vc=voiceCanvas.getContext('2d');
let captionIndex=0;
function caption(n){captionIndex=n;introText.textContent=narrative[n]?.[0]||'';introSub.textContent=narrative[n]?.[1]||'';if(renderer.xr.isPresenting)paintXRIntro()}
function finishIntro(){
 if(introDone)return;
 introDone=true;voiceLive=false;narration.pause();voiceCanvas.style.display='none';
 if('speechSynthesis' in window)speechSynthesis.cancel();
 introText.textContent='';introSub.textContent='';if(renderer.xr.isPresenting)paintXRIntro();
 $('introAuthor').style.display='block';$('startIntro').style.display='none';
 $('skip').style.display='none';$('enter').style.display='block';
}
function playSpeechFallback(){
 narrationFallback=true;
 if(!('speechSynthesis' in window))return;
 const u=new SpeechSynthesisUtterance(narrative.map(x=>x[0]).join(' ... '));
 u.lang='en-US';u.rate=.8;u.pitch=1.06;u.onstart=()=>{voiceLive=true};
 u.onend=()=>{voiceLive=false};speechSynthesis.cancel();speechSynthesis.speak(u);
}
$('startIntro').onclick=()=>{
 if(introStarted)return;
 introStarted=true;voiceLive=true;
 $('startIntro').style.display='none';$('skip').style.display='block';
 voiceCanvas.style.display='block';caption(0);if(renderer.xr.isPresenting)paintXRIntro();
 // HTML media, rather than browser speech synthesis, works in Quest Browser.
 const attempt=narration.play();
 attempt.catch(()=>{playSpeechFallback()});
 const steps=[4500,9000];steps.forEach((ms,i)=>setTimeout(()=>{if(!introDone)caption(i+1)},ms));
 setTimeout(finishIntro,14600);
};
narration.onended=()=>{voiceLive=false;finishIntro()};
narration.onerror=()=>{if(introStarted&&!introDone&&!narrationFallback)playSpeechFallback()};
$('skip').onclick=finishIntro;
let voiceTime=0;
function drawNarration(dt){
 if(!voiceLive||introDone)return;
 voiceTime+=dt;
 vc.clearRect(0,0,640,88);
 // The narration is a separate media file; no fake frequency spectrum is claimed.
 for(let i=0;i<62;i++){
  const x=(i+.5)*640/62,window=Math.pow(Math.max(0,1-Math.abs(i-31)/32),1.5);
  const value=(narrationFallback?.35:.6)*window*(.4+.25*Math.sin(i*.64+voiceTime*11)+.18*Math.sin(i*.25-voiceTime*6));
  const h=4+value*68;vc.fillStyle='rgba(164,215,255,'+(.25+window*.65)+')';
  vc.fillRect(x-2,44-h*.5,4,h);
 }
}
function setEQ(){controlIds.forEach((id,i)=>{$(id).value=eq[i];$(eqLabels[i]).textContent=(eq[i]>0?'+':'')+eq[i];if(filters)filters[i].gain.value=eq[i]});paintPanel()}
controlIds.forEach((id,i)=>$(id).addEventListener('input',()=>{eq[i]=+$(id).value;selected=i;setEQ()}));
button.onclick=()=>{const show=$('controls').style.display!=='block';$('controls').style.display=show?'block':'none';button.textContent=show?'HIDE CONTROLS':'CONTROLS'};
$('pause').onclick=async()=>{if(!context)return;if(music.paused){await context.resume();await music.play()}else music.pause()};
music.onended=()=>{status.textContent='Experience completed';music.currentTime=0};
async function initSound(){
 if(!context){
  context=new (window.AudioContext||window.webkitAudioContext)();
  filters=[
   new BiquadFilterNode(context,{type:'lowshelf',frequency:160}),
   new BiquadFilterNode(context,{type:'peaking',frequency:950,Q:.75}),
   new BiquadFilterNode(context,{type:'highshelf',frequency:2700})
  ];
  analyser=context.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.65;
  spectrum=new Uint8Array(analyser.frequencyBinCount);previous=new Uint8Array(spectrum.length);
  timeData=new Float32Array(analyser.fftSize);
  source=context.createMediaElementSource(music);source.connect(filters[0]);
  filters[0].connect(filters[1]);filters[1].connect(filters[2]);
  filters[2].connect(analyser);analyser.connect(context.destination);setEQ();
 }
 await context.resume();
}
function band(from,to){
 const ny=context.sampleRate/2;let l=Math.floor(from/ny*spectrum.length),h=Math.ceil(to/ny*spectrum.length),sum=0;
 l=Math.max(0,l);h=Math.min(spectrum.length,Math.max(h,l+1));
 for(let i=l;i<h;i++)sum+=spectrum[i];return sum/(h-l)/255;

let avgFlux=.01,onset=0,onsetCooldown=0,quiet=0;
// Deterministic sound dramaturgy. Stages respond to longer-term audio conditions;
// stage changes are held, not retriggered by every small FFT fluctuation.
const STAGES=['FIELD','TRACES','WIREFRAME','INTERWEAVE','FRACTURE','DRIFT','RETURN','DISSOLUTION'];
let stage=0,stageHold=0,stageMix=0,energyMemory=0,textureMemory=0,gestureMemory=0;
let act=0,actTime=0,actBlend=0,impact=0;
// Music-time dramaturgy: acts give the composition a visual syntax;
// live spectrum, RMS, novelty and gestures define the movement *inside* each act.
const ACTS=['FIELD / LATENCY','TRACES / EMERGENCE','WIREFRAME / GROWTH',
 'INTERWEAVE / TENSION','FRACTURE / RELEASE','PARTICLE / DRIFT',
 'RETURN / RESONANCE','DISSOLUTION'];
const ACT_CUTS=[0,.09,.21,.34,.48,.61,.75,.88,1];
function smooth01(v){v=THREE.MathUtils.clamp(v,0,1);return v*v*(3-2*v)}
function updateDramaturgy(dt){
 const energy=Math.min(1,rms*6.5);
 const texture=Math.min(1,mid*1.9+high*.9);
 energyMemory+=(energy-energyMemory)*Math.min(1,dt*.4);
 textureMemory+=(texture-textureMemory)*Math.min(1,dt*.6);
 gestureMemory+=(onset-gestureMemory)*Math.min(1,dt*1.6);
 const total=Number.isFinite(music.duration)&&music.duration>0?music.duration:402;
 const progress=THREE.MathUtils.clamp(music.currentTime/total,0,.999999);
 let next=ACT_CUTS.findIndex((cut,i)=>i<ACT_CUTS.length-1&&progress>=cut&&progress<ACT_CUTS[i+1]);
 next=THREE.MathUtils.clamp(next,0,ACTS.length-1);
 act=next;actTime=(progress-ACT_CUTS[act])/(ACT_CUTS[act+1]-ACT_CUTS[act]);
 // Near act boundaries old and new systems overlap gently rather than jump.
 actBlend=smooth01(actTime/.12);
 stage=act;stageMix+=(act-stageMix)*Math.min(1,dt*.55);
 impact+=((onset+flux*1.7)-impact)*Math.min(1,dt*5.4);
 if(renderer.xr.isPresenting&&hud.visible)paintPanel();
}

function analyze(dt){
 if(!analyser||music.paused||music.ended){
  low*=.97;mid*=.97;high*=.97;rms*=.97;onset*=.92;return;
 }
 analyser.getByteFrequencyData(spectrum);analyser.getFloatTimeDomainData(timeData);
 let sum=0,novel=0,count=0;
 for(let i=0;i<timeData.length;i+=4)sum+=timeData[i]*timeData[i];
 for(let i=2;i<Math.min(550,spectrum.length);i+=3){
  novel+=Math.max(0,spectrum[i]-previous[i])/255;count++;
 }
 previous.set(spectrum);
 const fluxNow=novel/Math.max(1,count);avgFlux=avgFlux*.98+fluxNow*.02;
 rms+=(Math.sqrt(sum/(timeData.length/4))-rms)*.16;
 low+=(band(20,160)-low)*.12;mid+=(band(160,2000)-mid)*.1;high+=(band(2000,12000)-high)*.1;
 onsetCooldown=Math.max(0,onsetCooldown-dt);
 if(fluxNow>Math.max(.033,avgFlux*2.2)&&rms>.018&&onsetCooldown<=0){onset=1;onsetCooldown=1.1}
 onset*=Math.exp(-dt*1.9);flux+=(fluxNow-flux)*.13;
 quiet+=((rms<.026?1:0)-quiet)*.03;
}
// Minimal sonic ecology: one filament network, one particulate shell, sparse tetrahedra.
const scene=new THREE.Scene();scene.background=new THREE.Color(0x010101);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,90);
camera.position.set(0,1.6,0);scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);
const root=new THREE.Group();scene.add(root);
// Bakkslide-inspired grayscale wireframe deformation, not a separate random particle effect.
const FIELD_GRID=46,fieldGeo=new THREE.SphereGeometry(3.25,FIELD_GRID,34);
const fieldBase=Float32Array.from(fieldGeo.attributes.position.array);
const fieldMat=new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.15,depthWrite:false,side:THREE.DoubleSide});
const wireField=new THREE.Mesh(fieldGeo,fieldMat);
wireField.position.set(0,1.6,0);wireField.rotation.set(0,0,0);
root.add(wireField);
let tactileEnergy=0,tactileSpread=0,tactileX=0,tactileY=0;
function deformWireField(t,pressure,texture){
 const a=fieldGeo.attributes.position.array;
 const tension=.12+.82*pressure+.7*texture+.65*tactileEnergy;
 // True immersive 3D wire membrane, not a plane facing the viewer.
 for(let i=0;i<a.length;i+=3){
  const bx=fieldBase[i],by=fieldBase[i+1],bz=fieldBase[i+2];
  const norm=Math.hypot(bx,by,bz)||1;
  const phi=Math.atan2(bz,bx),elevation=Math.asin(by/norm);
  const harmonic=Math.sin(phi*(act===4?14:7)+t*(.26+texture*.8))*Math.cos(elevation*(act===4?12:5)-t*.23);
  const localGesture=Math.exp(-Math.pow(phi-tactileX*2,2)*.65);
  const radius=norm+harmonic*tension*(act===4?.96:.58)+localGesture*tactileEnergy*.55;
  a[i]=bx/norm*radius;a[i+1]=by/norm*radius;a[i+2]=bz/norm*radius;
 }
 fieldGeo.attributes.position.needsUpdate=true;
 fieldMat.opacity=Math.min(.65,(act===2||act===3||act===4||act===6?.16:.018)+(act===2||act===4?.39:.16)*texture+.12*tactileEnergy);
}
const GOLD=Math.PI*(3-Math.sqrt(5));
const P=1900,particleArray=new Float32Array(P*3),particleDirections=[];
for(let i=0;i<P;i++){
 const y=1-2*(i+.5)/P,a=i*GOLD,c=Math.sqrt(1-y*y);
 particleDirections.push(new THREE.Vector3(c*Math.cos(a),y,c*Math.sin(a)));
}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(particleArray,3).setUsage(THREE.DynamicDrawUsage));
const particleMaterial=new THREE.PointsMaterial({color:0xf3f3f3,size:.018,transparent:true,opacity:.4,depthWrite:false});
const particleMesh=new THREE.Points(pg,particleMaterial);root.add(particleMesh);
// Expanding spectral shock fronts: pulses are initiated by real transients,
// then decay as travelling 3D geometry rather than flickering on every FFT frame.
const shocks=[];
for(let i=0;i<5;i++){
 const g=new THREE.TorusGeometry(1,.003,4,128);
 const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
 m.position.set(0,1.6,0);root.add(m);shocks.push({mesh:m,age:100});
}
let previousShock=0;
function driveShock(dt){
 if(onset>.76&&animationT-previousShock>.55){
  const shock=shocks.reduce((a,b)=>a.age>b.age?a:b);
  shock.age=0;previousShock=animationT;
  shock.mesh.rotation.set(.4+textureMemory*.7,animationT*.17,animationT*.11);
 }
 for(const shock of shocks){
  shock.age+=dt;
  shock.mesh.scale.setScalar(.4+shock.age*1.85);
  shock.mesh.material.opacity=shock.age<2.7&&[1,2,3,4,6].includes(act)?Math.pow(Math.max(0,1-shock.age/2.7),2)*(.12+.42*impact):0;
 }
}

const R=9,SEG=108,SIDES=4,filaments=[];
for(let i=0;i<R;i++){
 const geo=new THREE.BufferGeometry(),v=new Float32Array((SEG+1)*(SIDES+1)*3),ids=[];
 geo.setAttribute('position',new THREE.BufferAttribute(v,3).setUsage(THREE.DynamicDrawUsage));
 for(let j=0;j<SEG;j++)for(let k=0;k<SIDES;k++){const a=j*(SIDES+1)+k,b=a+SIDES+1;ids.push(a,b,a+1,b,b+1,a+1)}
 geo.setIndex(ids);
 const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xf5f5f5,transparent:true,opacity:.24,depthWrite:false,side:THREE.DoubleSide}));
 mesh.frustumCulled=false;root.add(mesh);filaments.push(mesh);
}
const tetraGeo=new THREE.TetrahedronGeometry(.12),tetraMat=new THREE.MeshBasicMaterial({color:0xdedede,transparent:true,opacity:.16,wireframe:true,depthWrite:false});
const T=7,tetra=new THREE.InstancedMesh(tetraGeo,tetraMat,T),dummy=new THREE.Object3D();root.add(tetra);tetra.frustumCulled=false;
let animationT=0;
function evolve(dt){
 updateDramaturgy(dt);
 const gain=+$('sensitivity').value;
 const lo=low*gain,mi=mid*gain,hi=high*gain;
 const pressure=THREE.MathUtils.clamp(energyMemory*2.4,0,1.2);
 const weave=THREE.MathUtils.clamp(textureMemory*2,0,1.2);
 const appear=smooth01(actTime/.16);
 const leave=1-smooth01((actTime-.85)/.15);
 const envelope=appear*leave;
 const shellActive=[.05,.1,1,.72,.95,.08,.84,.06][act];
 const strandActive=[.04,.62,.18,1,.16,.08,.78,.06][act];
 const dustActive=[.04,.12,.07,.16,.6,1,.43,.15][act];
 const breathing=1+.18*pressure+.12*lo+.25*tactileSpread;
 const fold=.09+weave*.56+tactileEnergy*.3;
 deformWireField(animationT,pressure,weave);
 fieldMat.opacity*=shellActive*(.3+.7*envelope);
 wireField.rotation.y=animationT*(act===4?.1:.013);
 wireField.rotation.z=Math.sin(animationT*.12)*.06;
 tactileEnergy*=Math.exp(-dt*1.4);tactileSpread*=Math.exp(-dt*.2);
 driveShock(dt);
 for(let i=0;i<P;i++){
  const d=particleDirections[i],distance=3.8+(i%13)*.2+Math.sin(i*14.7)*.15;
  // Per-particle phase is stable; the audio governs coherent cloud expansion.
  const sweep=act===5?(actTime*3.8):0;
  const radial=distance*(1+.2*pressure)+(.17*impact+.22*tactileEnergy)*Math.sin(i*.05+sweep);
  particleArray[i*3]=d.x*radial+d.z*sweep*.16;
  particleArray[i*3+1]=1.6+d.y*radial;
  particleArray[i*3+2]=d.z*radial-d.x*sweep*.16;
 }
 pg.attributes.position.needsUpdate=true;
 particleMaterial.opacity=(.014+.35*dustActive*(.35+.65*weave)+.13*impact)*(.28+.72*envelope);
 particleMaterial.size=.012+.02*hi;
 filaments.forEach((mesh,i)=>{
  const v=mesh.geometry.attributes.position.array;
  const angle=i*GOLD,ct=Math.cos(angle),st=Math.sin(angle);
  const radius=(2.65+i%3*.38)*breathing;
  const topology=i%2===0?1:-1;
  for(let j=0;j<=SEG;j++){
   const u=j/SEG,a=u*Math.PI*2,layer=Math.sin(a*3+topology*act*.65+animationT*.035);
   const displacement=fold*layer*strandActive*(.3+envelope);
   const x=radius*Math.cos(a)+displacement*Math.sin(2*a);
   const y=radius*.63*Math.sin(a)+displacement*.55*Math.cos(2*a);
   const z=radius*.66*Math.sin(2*a+i*.3)+displacement*Math.cos(a);
   const X=x*ct-y*st,Y=x*st+y*ct;
   for(let k=0;k<=SIDES;k++){

    const thickness=.003+.009*pressure+.018*impact;
    v[p]=X+Math.cos(q)*thickness;
    v[p+1]=1.6+Y+Math.sin(q)*thickness;
    v[p+2]=z+Math.sin(q)*thickness;
   }
  }

  mesh.material.opacity=Math.min(.8,strandActive*(.04+.56*weave+.13*impact)*(.27+.73*envelope));
 });
 for(let i=0;i<T;i++){
  const y=1-2*(i+.5)/T,a=i*GOLD,c=Math.sqrt(1-y*y),r=3.4+impact*.8;
  dummy.position.set(r*c*Math.cos(a),1.6+r*y,r*c*Math.sin(a));

 }

}
function openControlPanel(){ $('controls').style.display='none';button.style.display='block';button.textContent='CONTROLS'}
$('enter').onclick=async()=>{
 try{
  // Use the direct click to authorize media playback before async continuation.
  const pending=initSound();
  const play=music.play();
  await Promise.all([pending,play]);
  entered=true;narration.pause();$('intro').style.display='none';xrIntro.visible=false;hud.visible=renderer.xr.isPresenting;openControlPanel();if(renderer.xr.isPresenting)button.style.display='none';
  status.textContent='Sonic ecology · live FFT';
 }catch(err){introSub.textContent='Unable to start sound: '+err.message}
};
// World-space intro: available immediately after entering VR or AR, before the music.
const xrIntroCanvas=document.createElement('canvas');xrIntroCanvas.width=1024;xrIntroCanvas.height=640;
const xi=xrIntroCanvas.getContext('2d'),xrIntroTex=new THREE.CanvasTexture(xrIntroCanvas);
const xrIntro=new THREE.Mesh(new THREE.PlaneGeometry(1.65,1.03),new THREE.MeshBasicMaterial({map:xrIntroTex,transparent:true,depthTest:false,depthWrite:false}));
xrIntro.renderOrder=150;xrIntro.visible=false;scene.add(xrIntro);
let xrMode='vr',xrHandLatch={left:false,right:false};
function paintXRIntro(){
 xi.clearRect(0,0,1024,640);
 xi.fillStyle=xrMode==='ar'?'rgba(0,0,0,.78)':'rgba(0,0,0,.94)';xi.fillRect(0,0,1024,640);
 xi.strokeStyle='#aaaaaa';xi.lineWidth=2;xi.strokeRect(4,4,1016,632);
 xi.fillStyle='#ededed';xi.textAlign='center';
 xi.font='25px Arial';xi.fillText('TECHNO POESIS',512,82);
 xi.font='66px Arial';xi.fillText('ATMOSPHERE',512,174);

  const line=narrative[captionIndex]||narrative[0];
  xi.font='29px Arial';xi.fillText(line[0],512,275);
  xi.fillStyle='#c2c2c2';xi.font='23px Arial';xi.fillText(line[1],512,332);
 }else if(!introDone){
  xi.font='28px Arial';xi.fillText('Invisible networks connect all forms of life.',512,283);
  xi.font='21px Arial';xi.fillText('Redes invisibles conectan todas las formas de vida.',512,332);
 }else{
  xi.font='26px Arial';xi.fillText('Ricardo P. Tapia Fernández  ·  Oktopus Art Studio',512,285);
  xi.font='20px Arial';xi.fillText('Art · Nature · Technology   /   @oktopus.art',512,331);
 }
 xi.fillStyle='#f2f2f2';xi.font='28px Arial';
 xi.fillText(introDone?'ENTER EXPERIENCE':introStarted?'NARRATION · LISTENING':'START NARRATION',512,445);
 xi.fillStyle='#bdbdbd';xi.font='21px Arial';
 xi.fillText(introDone?'Pull trigger / pinch to enter':introStarted?'Pull trigger / pinch to skip':'Pull trigger / pinch to start',512,497);
 xi.font='18px Arial';xi.fillText(xrMode==='ar'?'MIXED REALITY':'IMMERSIVE VR',512,574);
 xrIntroTex.needsUpdate=true;
}
function triggerXRIntro(){
 if(entered)return;
 // Direct invocation from WebXR input-select event; user gesture is required for audio.
 if(!introStarted)$('startIntro').click();
 else if(!introDone)$('skip').click();
 else $('enter').click();
 paintXRIntro();
}
function updateXRIntroPose(){
 const cam=renderer.xr.getCamera(),position=new THREE.Vector3(),quaternion=new THREE.Quaternion();
 cam.getWorldPosition(position);cam.getWorldQuaternion(quaternion);
 xrIntro.position.copy(position).add(new THREE.Vector3(0,0,-1.9).applyQuaternion(quaternion));
 xrIntro.quaternion.copy(quaternion);
 xrIntro.visible=!entered;
}

// VR HUD follows viewpoint, offset to the left, always visible and never front-center.
const panelCanvas=document.createElement('canvas');panelCanvas.width=640;panelCanvas.height=384;
const panelCtx=panelCanvas.getContext('2d'),panelTexture=new THREE.CanvasTexture(panelCanvas);
const hud=new THREE.Mesh(new THREE.PlaneGeometry(.63,.38),new THREE.MeshBasicMaterial({map:panelTexture,transparent:true,depthTest:false}));
hud.renderOrder=100;hud.visible=false;scene.add(hud);
function paintPanel(){
 panelCtx.clearRect(0,0,640,384);panelCtx.fillStyle='rgba(4,11,27,.79)';panelCtx.fillRect(0,0,640,384);
 panelCtx.strokeStyle='#4b6484';panelCtx.strokeRect(2,2,636,380);
 panelCtx.fillStyle='#c5dcf2';panelCtx.font='27px Arial';panelCtx.fillText('ATMOSPHERE · EQ',22,44);
 panelCtx.fillStyle='#97adc4';panelCtx.font='17px Arial';panelCtx.fillText('L trigger: band    R stick: gain',22,76);
 ['BASS','MID','HIGH'].forEach((name,i)=>{
  const y=128+i*83;panelCtx.fillStyle=i===selected?'#d3e9ff':'#7994af';panelCtx.font='21px Arial';panelCtx.fillText(name,22,y);
  panelCtx.fillStyle='#253853';panelCtx.fillRect(110,y-16,368,12);
  panelCtx.fillStyle='#93c9f3';panelCtx.fillRect(110,y-16,368*(eq[i]+12)/24,12);
  panelCtx.fillText((eq[i]>0?'+':'')+eq[i]+' dB',495,y);
 });
 panelCtx.fillStyle='#8ba9c9';panelCtx.font='17px Arial';panelCtx.fillText('Pinch: sculpt · '+STAGES[stage],22,367);panelTexture.needsUpdate=true;
}
paintPanel();
const ctrl0=renderer.xr.getController(0),ctrl1=renderer.xr.getController(1);scene.add(ctrl0,ctrl1);
for(const ctrl of [ctrl0,ctrl1]){
 ctrl.addEventListener('selectstart',(event)=>{
  if(!renderer.xr.isPresenting)return;
  if(!entered){triggerXRIntro();return}
  if(event.data?.handedness==='left'){selected=(selected+1)%3;paintPanel()}
 });
}
// Native WebXR hand tracking: actual tracked joint positions, simple monochrome skeleton.
const jointNames=['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip',
'index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip',
'middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip',
'ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip',
'pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip'];
const bonePairs=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[8,9],[0,10],[10,11],[11,12],[12,13],[13,14],[0,15],[15,16],[16,17],[17,18],[18,19],[0,20],[20,21],[21,22],[22,23],[23,24]];
const handMaterial=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7,depthWrite:false});
const handJointGeometry=new THREE.SphereGeometry(.007,6,5);
const handBoneGeometry=new THREE.CylinderGeometry(.0027,.0027,1,5);
const axisY=new THREE.Vector3(0,1,0);
function buildHand(){
 const group=new THREE.Group(),points=[],bones=[],positions=jointNames.map(()=>new THREE.Vector3());
 for(let i=0;i<jointNames.length;i++){const m=new THREE.Mesh(handJointGeometry,handMaterial);points.push(m);group.add(m)}
 for(let i=0;i<bonePairs.length;i++){const m=new THREE.Mesh(handBoneGeometry,handMaterial);bones.push(m);group.add(m)}
 scene.add(group);group.visible=false;return {group,points,bones,positions,pinching:false};
}
const trackedHands={left:buildHand(),right:buildHand()};
function updateHands(frame,dt){
 if(!renderer.xr.isPresenting||!frame){trackedHands.left.group.visible=false;trackedHands.right.group.visible=false;return}
 const space=renderer.xr.getReferenceSpace(),session=renderer.xr.getSession();
 if(!space||!session)return;
 const seen={left:false,right:false};
 for(const src of session.inputSources){
  if(!src.hand||!trackedHands[src.handedness])continue;
  const hand=trackedHands[src.handedness];seen[src.handedness]=true;
  let n=0;
  for(let i=0;i<jointNames.length;i++){
   const joint=src.hand.get(jointNames[i]);
   const pose=joint?frame.getJointPose(joint,space):null;
   hand.points[i].visible=!!pose;
   if(!pose)continue;
   const p=pose.transform.position;
   hand.positions[i].set(p.x,p.y,p.z);
   hand.points[i].position.copy(hand.positions[i]);
   hand.points[i].scale.setScalar(THREE.MathUtils.clamp((pose.radius||.007)/.007,.6,1.6));n++;
  }
  hand.group.visible=n>=12;
  for(let i=0;i<bonePairs.length;i++){
   const [a,b]=bonePairs[i],bone=hand.bones[i];
   bone.visible=hand.points[a].visible&&hand.points[b].visible;
   if(!bone.visible)continue;
   const first=hand.positions[a],second=hand.positions[b];
   const direction=second.clone().sub(first),length=direction.length();
   bone.position.copy(first).add(second).multiplyScalar(.5);
   bone.quaternion.setFromUnitVectors(axisY,direction.normalize());
   bone.scale.set(1,length,1);
  }
  if(!hand.group.visible||!hand.points[4].visible||!hand.points[9].visible)continue;
  const tip=hand.positions[9],thumb=hand.positions[4];
  const pinch=tip.distanceTo(thumb)<.03;
  if(pinch){
   tactileEnergy=Math.min(1.2,tactileEnergy+dt*2);
   tactileX+=(tip.x-tactileX)*.16;tactileY+=(tip.y-1.5-tactileY)*.16;
   if(!hand.pinching){if(!entered&&src.handedness==='right')triggerXRIntro();else if(entered&&src.handedness==='left'){selected=(selected+1)%3;paintPanel()}}
  }
  hand.pinching=pinch;
  if(src.handedness==='right'&&hand.points[24].visible){
   const spread=hand.positions[9].distanceTo(hand.positions[24]);
   tactileSpread+=(THREE.MathUtils.clamp((spread-.085)*5,0,.8)-tactileSpread)*.15;
  }
 }
 for(const side of ['left','right'])if(!seen[side]){trackedHands[side].group.visible=false;trackedHands[side].pinching=false}
}

let inputCooldown=0;
function readQuest(dt){
 if(!renderer.xr.isPresenting)return;
 inputCooldown=Math.max(0,inputCooldown-dt);
 const session=renderer.xr.getSession();if(!session)return;
 for(const src of session.inputSources){
  if(!src.gamepad||src.hand)continue;
  const a=src.gamepad.axes,x=a.length>=4?a[2]:a[0]||0,y=a.length>=4?a[3]:a[1]||0;
  if(src.handedness==='right'&&Math.abs(x)>.4&&inputCooldown===0){eq[selected]=THREE.MathUtils.clamp(eq[selected]+Math.sign(x),-12,12);setEQ();inputCooldown=.13}
  if(src.handedness==='left'&&Math.abs(y)>.4){$('sensitivity').value=THREE.MathUtils.clamp(+$('sensitivity').value-y*dt*.5,.3,2.8)}
  if(src.handedness==='right'&&Math.abs(y)>.4){tactileSpread=THREE.MathUtils.clamp(tactileSpread-y*dt*.5,0,1)}
  if(src.gamepad.buttons?.[0]?.pressed){tactileEnergy=Math.min(1,tactileEnergy+dt*1.7)}
 }
 // Lateral HUD aligned to the headset, updated every frame.
 const xrCam=renderer.xr.getCamera(),pos=new THREE.Vector3(),quat=new THREE.Quaternion();
 xrCam.getWorldPosition(pos);xrCam.getWorldQuaternion(quat);
 hud.position.copy(pos).add(new THREE.Vector3(-.84,-.22,-1.2).applyQuaternion(quat));
 hud.quaternion.copy(quat);hud.visible=entered;
 if(!entered)updateXRIntroPose();
}
async function setupVR(){
 if(!navigator.xr||!window.isSecureContext)return;
 async function offerMode(mode,label){
  let supported=false;
  try{supported=await navigator.xr.isSessionSupported(mode)}catch(err){}
  if(!supported)return;
  const button=document.createElement('button');button.textContent=label;$('xrButton').appendChild(button);
  button.onclick=async()=>{
   if(renderer.xr.isPresenting){await renderer.xr.getSession().end();return}
   try{
    xrMode=mode==='immersive-ar'?'ar':'vr';
    // AR requires alpha compositing; never paint an opaque black background.
    scene.background=xrMode==='ar'?null:new THREE.Color(0x010101);
    renderer.setClearColor(0x000000,xrMode==='ar'?0:1);
    const options={optionalFeatures:['local-floor','hand-tracking']};
    const session=await navigator.xr.requestSession(mode,options);
    await renderer.xr.setSession(session);
    paintXRIntro();xrIntro.visible=!entered;hud.visible=entered;
    button.textContent=xrMode==='ar'?'EXIT AR':'EXIT VR';
   }catch(err){
    scene.background=new THREE.Color(0x010101);
    renderer.setClearColor(0x000000,1);
    status.textContent='XR entry failed: '+err.message;
   }
  };
  renderer.xr.addEventListener('sessionend',()=>{button.textContent=label});
 }
 await offerMode('immersive-vr','ENTER VR');
 await offerMode('immersive-ar','ENTER AR / MR');
 renderer.xr.addEventListener('sessionstart',()=>{
  $('controls').style.display='none';button.style.display='none';
  hud.visible=entered;xrIntro.visible=!entered;paintXRIntro();
 });
 renderer.xr.addEventListener('sessionend',()=>{
  hud.visible=false;xrIntro.visible=false;
  scene.background=new THREE.Color(0x010101);renderer.setClearColor(0x000000,1);
  if(entered)openControlPanel();
 });
}
setupVR();
let voiceClock=0;
const clock=new THREE.Clock();
renderer.setAnimationLoop((timestamp,frame)=>{
 const dt=Math.min(.05,clock.getDelta());
 voiceClock+=dt;
 if(voiceLive){
  vc.clearRect(0,0,640,88);
  for(let i=0;i<48;i++){
   const x=(i+.5)*640/48;
   const h=(4+26*(.5+.4*Math.sin(voiceClock*12+i*.45)))*Math.max(.15,1-Math.abs(i-24)/27);
   vc.fillStyle='rgba(143,194,238,.6)';vc.fillRect(x-2,44-h,4,h*2);
  }
 }
 if(renderer.xr.isPresenting){updateHands(frame,dt);readQuest(dt)}
 if(entered){analyze(dt);animationT+=dt;evolve(dt)}
 renderer.render(scene,camera);
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
